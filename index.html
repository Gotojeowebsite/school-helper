<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AcademiaPro — Student Planner & Homework Tracker</title>
  <meta name="description" content="A comprehensive academic organizer for tracking homework assignments, exams, class timetables, weighted grades, and GPA." />
  
  <!-- Modern Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Design System CSS -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="app-container">
    <!-- Desktop & Tablet Sidebar -->
    <aside class="app-sidebar">
      <div class="sidebar-header">
        <div class="brand-logo">
          <div class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
              <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
            </svg>
          </div>
          <span>AcademiaPro</span>
        </div>
      </div>

      <!-- Active Academic Term -->
      <div class="semester-selector-wrapper">
        <select class="semester-select" id="semester-select" title="Select Active Term">
          <!-- Populated dynamically -->
        </select>
      </div>

      <!-- Sidebar Navigation Links -->
      <nav class="sidebar-nav">
        <div class="nav-section-title">Overview</div>
        <a href="#dashboard" class="nav-item active" data-nav-target="dashboard">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
          </span>
          <span>Dashboard</span>
        </a>

        <a href="#calendar" class="nav-item" data-nav-target="calendar">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
          </span>
          <span>Calendar</span>
        </a>

        <div class="nav-section-title">Academics</div>
        <a href="#assignments" class="nav-item" data-nav-target="assignments">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
          </span>
          <span>Assignments</span>
          <span class="nav-badge" id="nav-badge-assignments">0</span>
        </a>

        <a href="#exams" class="nav-item" data-nav-target="exams">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
          </span>
          <span>Exams & Tests</span>
          <span class="nav-badge" id="nav-badge-exams">0</span>
        </a>

        <a href="#schedule" class="nav-item" data-nav-target="schedule">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
          </span>
          <span>Timetable</span>
        </a>

        <a href="#grades" class="nav-item" data-nav-target="grades">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
          </span>
          <span>Grades & Simulator</span>
        </a>

        <a href="#classes" class="nav-item" data-nav-target="classes">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path></svg>
          </span>
          <span>Classes Directory</span>
        </a>

        <div class="nav-section-title">Insights & Tools</div>
        <a href="#analytics" class="nav-item" data-nav-target="analytics">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.21 15.89A10 10 0 1 1 8 2.83"></path><path d="M22 12A10 10 0 0 0 12 2v10z"></path></svg>
          </span>
          <span>Analytics</span>
        </a>

        <a href="#settings" class="nav-item" data-nav-target="settings">
          <span class="nav-item-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
          </span>
          <span>Settings & Sync</span>
        </a>
      </nav>

      <!-- Sidebar User Profile Footer -->
      <div class="sidebar-footer">
        <div class="sidebar-user" id="sidebar-user-card" style="cursor:pointer;" title="Click to manage Account & Cloud Sync">
          <div class="user-avatar" id="user-avatar-display">AM</div>
          <div class="user-info">
            <span class="user-name" id="user-name-display">Alex Morgan</span>
            <span class="user-status" id="user-status-display">
              <span class="cloud-status-dot offline"></span> Local Offline
            </span>
          </div>
        </div>
        <button class="icon-btn" id="sidebar-auth-btn" title="Sign In / Cloud Sync" style="width:32px; height:32px; flex-shrink:0;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
        </button>
      </div>
    </aside>

    <!-- Main Content Stage -->
    <main class="app-main">
      <!-- Global Sticky Header -->
      <header class="app-header">
        <div class="header-left">
          <button class="mobile-menu-toggle" id="mobile-menu-toggle" title="Toggle Navigation">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
          </button>

          <div class="global-search-wrapper">
            <span class="search-icon">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
            </span>
            <input type="text" class="global-search-input" id="global-search-input" placeholder="Search tasks, exams, classes, notes..." />
            <span class="search-shortcut-badge">/</span>
          </div>
        </div>

        <div class="header-right">
          <!-- Notification Bell -->
          <button class="icon-btn" id="notification-btn" title="View Due Reminders & Overdue Alerts">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
            <span class="notification-dot"></span>
          </button>

          <!-- Theme Toggle -->
          <button class="icon-btn" id="theme-toggle-btn" title="Toggle Dark/Light Mode">
            <span class="theme-icon"></span>
          </button>

          <!-- Cloud Account / Sync Button -->
          <button class="icon-btn" id="header-auth-btn" title="Cloud Account & Realtime Sync">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"></path></svg>
          </button>

          <!-- Quick Add Button -->
          <button class="btn-primary" id="quick-add-btn" title="Quick Add Task or Exam (Press 'Q')">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Add New</span>
          </button>
        </div>
      </header>

      <!-- View Sections Stage -->
      <div class="app-viewport">
        <!-- View: Dashboard -->
        <section id="view-dashboard" class="view-section active"></section>

        <!-- View: Calendar -->
        <section id="view-calendar" class="view-section"></section>

        <!-- View: Assignments -->
        <section id="view-assignments" class="view-section"></section>

        <!-- View: Exams -->
        <section id="view-exams" class="view-section"></section>

        <!-- View: Timetable -->
        <section id="view-schedule" class="view-section"></section>

        <!-- View: Grades & What-If Simulator -->
        <section id="view-grades" class="view-section"></section>

        <!-- View: Classes Directory -->
        <section id="view-classes" class="view-section"></section>

        <!-- View: Analytics -->
        <section id="view-analytics" class="view-section"></section>

        <!-- View: Settings & Sync -->
        <section id="view-settings" class="view-section"></section>
      </div>
    </main>

    <!-- Mobile Bottom Navigation Bar -->
    <nav class="mobile-bottom-nav">
      <button class="mobile-nav-btn active" data-nav-target="dashboard">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        <span>Home</span>
      </button>
      <button class="mobile-nav-btn" data-nav-target="assignments">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"></path><rect x="8" y="2" width="8" height="4" rx="1" ry="1"></rect></svg>
        <span>Tasks</span>
      </button>
      <button class="mobile-nav-btn" data-nav-target="calendar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        <span>Calendar</span>
      </button>
      <button class="mobile-nav-btn" data-nav-target="exams">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>
        <span>Exams</span>
      </button>
      <button class="mobile-nav-btn" data-nav-target="grades">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"></path></svg>
        <span>Grades</span>
      </button>
    </nav>

    <!-- Universal Modal Backdrop Container -->
    <div class="modal-overlay" id="modal-overlay">
      <div id="modal-container"></div>
    </div>

    <!-- Toast Notification Tray -->
    <div class="toast-container" id="toast-container"></div>
  </div>

  <!-- Firebase v10 SDKs (Compat via CDN) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <!-- Application Script -->
  <script src="js/app.js" defer></script>
</body>
</html>
