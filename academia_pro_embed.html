  function isOverdue(dueDateString) {
    if (!dueDateString) return false;
    return new Date(dueDateString).getTime() < Date.now();
  }

  function getDaysUntil(dateString) {
    const target = new Date(dateString).getTime();
    const now = Date.now();
    const diff = target - now;
    return Math.ceil(diff / (1000 * 60 * 60 * 24));
  }

  function formatRelativeDueDate(dateString) {
    if (!dateString) return 'No due date';
    const date = new Date(dateString);
    if (isNaN(date.getTime())) return dateString;

    const days = getDaysUntil(dateString);
    const timeStr = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });

    if (days < 0) {
      const pastDays = Math.abs(days);
      return `<span style="color:var(--danger-text);font-weight:700;">Overdue by ${pastDays} day${pastDays > 1 ? 's' : ''}</span>`;
    }
    if (days === 0) {
      return `<span style="color:var(--warning-text);font-weight:700;">Due Today (${timeStr})</span>`;
    }
    if (days === 1) {
      return `<span style="color:var(--info-text);font-weight:600;">Due Tomorrow (${timeStr})</span>`;
    }
    if (days <= 7) {
      return `<span>Due in ${days} days (${date.toLocaleDateString([], { weekday: 'short' })})</span>`;
    }
    return `<span>Due ${date.toLocaleDateString([], { month: 'short', day: 'numeric' })}</span>`;
  }

  // --- TASK ROW HTML HELPER ---
  function renderTaskItemHTML(task) {
    const cls = store.getClassById(task.classId);
    const isDone = task.status === 'completed';
    const isLate = !isDone && isOverdue(task.dueDate);

    const subtaskTotal = Array.isArray(task.subtasks) ? task.subtasks.length : 0;
    const subtaskDone = Array.isArray(task.subtasks) ? task.subtasks.filter(st => st.isCompleted).length : 0;

    return `
      <div class="task-item ${isDone ? 'completed' : ''} ${isLate ? 'overdue' : ''}" data-task-id="${task.id}">
        <input type="checkbox" class="task-checkbox" ${isDone ? 'checked' : ''} data-action="toggle-task" title="Mark complete" />
        
        <div class="task-content">
          <div class="task-header-row">
            ${cls ? `<span class="task-course-pill" style="background:${cls.color}">${cls.name}</span>` : ''}
            <span class="badge ${task.priority === 'high' ? 'danger' : (task.priority === 'medium' ? 'warning' : 'neutral')}">
              ${task.priority}
            </span>
            <span style="font-size:0.6875rem; color:var(--text-muted); text-transform:uppercase; font-weight:600;">${task.type}</span>
          </div>

          <div class="task-title">${task.title}</div>
          ${task.description ? `<div style="font-size:0.75rem; color:var(--text-secondary); margin-top:0.125rem;">${task.description}</div>` : ''}

          <div class="task-meta-row">
            <div class="task-meta-item">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
              ${formatRelativeDueDate(task.dueDate)}
            </div>

            ${subtaskTotal > 0 ? `
              <div class="task-meta-item">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 11 12 14 22 4"></polyline><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"></path></svg>
                ${subtaskDone}/${subtaskTotal} subtasks
              </div>
            ` : ''}

            ${task.scoreEarned !== null ? `
              <div class="task-meta-item" style="color:var(--success-text); font-weight:700;">
                ★ ${task.scoreEarned}/${task.maxScore || 100}
              </div>
            ` : ''}
          </div>
        </div>

        <div class="task-actions">
          <button class="icon-btn" data-action="edit-task" title="Edit Assignment" style="width:28px; height:28px;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
          </button>
          <button class="icon-btn" data-action="delete-task" title="Delete Assignment" style="width:28px; height:28px; color:var(--danger);">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
          </button>
        </div>
      </div>
    `;
  }

  function bindTaskItemEvents(parent) {
    parent.querySelectorAll('[data-action="toggle-task"]').forEach(cb => {
      cb.addEventListener('change', (e) => {
        const taskId = e.target.closest('.task-item').getAttribute('data-task-id');
        store.toggleAssignmentComplete(taskId);
      });
    });

    parent.querySelectorAll('[data-action="edit-task"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const taskId = e.target.closest('.task-item').getAttribute('data-task-id');
        const task = store.getAssignments().find(a => a.id === taskId);
        if (task) openAssignmentModal(task);
      });
    });

    parent.querySelectorAll('[data-action="delete-task"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const taskId = e.target.closest('.task-item').getAttribute('data-task-id');
        if (confirm('Delete this assignment?')) {
          store.deleteAssignment(taskId);
          showToast('Assignment deleted', 'info');
        }
      });
    });
  }

    // Filters
    if (state.filters.assignmentClass !== 'all') {
      allAssignments = allAssignments.filter(a => a.classId === state.filters.assignmentClass);
    }
    if (state.filters.assignmentType !== 'all') {
      allAssignments = allAssignments.filter(a => a.type === state.filters.assignmentType);
    }
    if (state.filters.assignmentPriority !== 'all') {
      allAssignments = allAssignments.filter(a => a.priority === state.filters.assignmentPriority);
    }
    if (state.filters.assignmentStatus === 'pending') {
      allAssignments = allAssignments.filter(a => a.status !== 'completed');
    } else if (state.filters.assignmentStatus === 'completed') {
      allAssignments = allAssignments.filter(a => a.status === 'completed');
    } else if (state.filters.assignmentStatus === 'overdue') {
      allAssignments = allAssignments.filter(a => a.status !== 'completed' && isOverdue(a.dueDate));
    }

    if (state.searchQuery) {
      allAssignments = allAssignments.filter(a => 
        a.title.toLowerCase().includes(state.searchQuery) ||
        (a.description && a.description.toLowerCase().includes(state.searchQuery))
      );

      if (state.filters.assignmentSort === 'dueDate-desc') {
        return (b.dueDate || '').localeCompare(a.dueDate || '');

  // --- VIEW: EXAMS ---

    const upcomingExams = exams.filter(e => e.date >= todayStr).sort((a, b) => a.date.localeCompare(b.date));

        <div class="exam-header">
          <div>
            ${cls ? `<span class="badge" style="background:${cls.color}20; color:${cls.color}; margin-bottom:0.375rem;">${cls.name}</span>` : ''}
            <div class="exam-title">${exam.title}</div>
          </div>
          <span class="exam-countdown-pill ${isPast ? 'future' : (days <= 2 ? 'urgent' : (days <= 7 ? 'soon' : 'future'))}">
            ${isPast ? 'Completed' : (days === 0 ? 'Today' : (days === 1 ? 'Tomorrow' : `${days} days left`))}
          </span>
        </div>

        <div class="exam-details-grid">
          <div class="exam-detail-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            ${new Date(exam.date).toLocaleDateString([], { month: 'short', day: 'numeric', weekday: 'short' })}
          </div>
          <div class="exam-detail-item">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
            ${exam.startTime} (${exam.duration || 60}m)
          </div>
          ${exam.room ? `
            <div class="exam-detail-item">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg>
              ${exam.room} ${exam.seatNumber ? `· ${exam.seatNumber}` : ''}
            </div>
          ` : ''}
          ${exam.scoreEarned !== null ? `
            <div class="exam-detail-item" style="color:var(--success-text); font-weight:700;">
              Score: ${exam.scoreEarned}/${exam.maxScore || 100} (${Math.round((exam.scoreEarned / (exam.maxScore || 100)) * 100)}%)
            </div>
          ` : ''}
        </div>

        ${Array.isArray(exam.topics) && exam.topics.length > 0 ? `
          <div style="margin-top:0.5rem; font-size:0.75rem; border-top:1px solid var(--border-subtle); padding-top:0.5rem;">
            <div style="font-weight:700; color:var(--text-muted); margin-bottom:0.25rem; font-size:0.6875rem; text-transform:uppercase;">Study Topics:</div>
            <div style="display:flex; flex-wrap:wrap; gap:0.25rem;">
              ${exam.topics.map(t => `<span class="badge neutral" style="font-size:0.6875rem;">${t}</span>`).join('')}
            </div>
          </div>
        ` : ''}

        <div style="display:flex; justify-content:flex-end; gap:0.375rem; margin-top:0.875rem; border-top:1px solid var(--border-subtle); padding-top:0.625rem;">
          <button class="btn-ghost" data-action="edit-exam" style="font-size:0.75rem;">Edit</button>
          <button class="btn-ghost" data-action="delete-exam" style="font-size:0.75rem; color:var(--danger);">Delete</button>
        </div>
      </div>
    `;
  }

  function bindExamCardEvents(parent) {
    parent.querySelectorAll('[data-action="edit-exam"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const examId = e.target.closest('.exam-card').getAttribute('data-exam-id');
        const exam = store.getExams().find(ex => ex.id === examId);
        if (exam) openExamModal(exam);
      });
    });

    parent.querySelectorAll('[data-action="delete-exam"]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        const examId = e.target.closest('.exam-card').getAttribute('data-exam-id');
        if (confirm('Delete this exam?')) {
          store.deleteExam(examId);
          showToast('Exam deleted', 'info');
        }
      });
    });
  }

  // --- VIEW: CALENDAR ---
  function renderCalendarView() {
    const container = document.getElementById('view-calendar');
    if (!container) return;

    const curDate = state.calendarDate;
    const year = curDate.getFullYear();
    const month = curDate.getMonth();

    const monthNames = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
    const firstDay = new Date(year, month, 1).getDay();
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const daysInPrevMonth = new Date(year, month, 0).getDate();

    const assignments = store.getAssignments();
    const exams = store.getExams();

    let calendarCellsHTML = '';

    // Prev month padding
    for (let i = firstDay - 1; i >= 0; i--) {
      calendarCellsHTML += `
        <div class="calendar-day-cell other-month">
          <span class="calendar-day-number">${daysInPrevMonth - i}</span>
        </div>
      `;
    }

    // Current month days
    const today = new Date();
    const isThisMonth = today.getFullYear() === year && today.getMonth() === month;

    for (let day = 1; day <= daysInMonth; day++) {
      const isToday = isThisMonth && today.getDate() === day;
      const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;

      const dayAsgs = assignments.filter(a => a.dueDate && a.dueDate.startsWith(dateStr));
      const dayExams = exams.filter(e => e.date === dateStr);

      calendarCellsHTML += `
        <div class="calendar-day-cell ${isToday ? 'today' : ''}" data-date="${dateStr}">
          <span class="calendar-day-number">${day}</span>
          <div style="display:flex; flex-direction:column; gap:2px; margin-top:2px; overflow:hidden;">
            ${dayExams.map(e => `<span class="cal-event-pill" data-cal-exam-id="${e.id}" style="background:#ef4444;" title="Click to view/edit exam">📝 ${escapeHTML(e.title)}</span>`).join('')}
            ${dayAsgs.map(a => {
              const cls = store.getClassById(a.classId);
              return `<span class="cal-event-pill" data-cal-task-id="${a.id}" style="background:${cls ? cls.color : 'var(--accent)'};" title="Click to view/edit assignment">${escapeHTML(a.title)}</span>`;
            }).join('')}
          </div>
        </div>
      `;
    }

    // Fill remaining grid slots
    const totalRendered = firstDay + daysInMonth;
    const nextPadding = totalRendered <= 35 ? (35 - totalRendered) : (42 - totalRendered);
    for (let i = 1; i <= nextPadding; i++) {
      calendarCellsHTML += `
        <div class="calendar-day-cell other-month">
          <span class="calendar-day-number">${i}</span>
        </div>
      `;
    }

    container.innerHTML = `
      <div class="section-header">
        <div>
          <h1 class="section-title">Academic Calendar</h1>
          <p class="section-subtitle">Visual overview of deadlines, exam sessions, and schedule.</p>
        </div>
        <div class="header-actions">
          <button class="btn-secondary" id="cal-btn-prev">‹ Prev</button>
          <button class="btn-secondary" id="cal-btn-today">Today</button>
          <button class="btn-secondary" id="cal-btn-next">Next ›</button>
          <button class="btn-primary" id="cal-btn-add">+ Add Task</button>
        </div>
      </div>

      <div class="calendar-container">
        <div class="calendar-header">
          <h2 style="font-size:1.125rem; font-weight:700; color:var(--text-primary);">
            ${monthNames[month]} ${year}
          </h2>
        </div>

        <div class="calendar-grid-header">
          <span>Sun</span><span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span>
        </div>

        <div class="calendar-days-matrix">
          ${calendarCellsHTML}
        </div>
      </div>
    `;

    container.querySelector('#cal-btn-prev')?.addEventListener('click', () => {
      state.calendarDate.setMonth(state.calendarDate.getMonth() - 1);
      renderCalendarView();
    });
    container.querySelector('#cal-btn-next')?.addEventListener('click', () => {
      state.calendarDate.setMonth(state.calendarDate.getMonth() + 1);
      renderCalendarView();
    });
    container.querySelector('#cal-btn-today')?.addEventListener('click', () => {
      state.calendarDate = new Date();
      renderCalendarView();
    });
    container.querySelector('#cal-btn-add')?.addEventListener('click', () => openAssignmentModal());

    container.querySelectorAll('[data-cal-task-id]').forEach(pill => {
      pill.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = pill.getAttribute('data-cal-task-id');
        const task = store.getAssignments().find(a => a.id === id);
        if (task) openAssignmentModal(task);
      });
    });

    container.querySelectorAll('[data-cal-exam-id]').forEach(pill => {
      pill.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = pill.getAttribute('data-cal-exam-id');
        const exam = store.getExams().find(ex => ex.id === id);
        if (exam) openExamModal(exam);
      });
    });

    container.querySelectorAll('.calendar-day-cell:not(.other-month)').forEach(cell => {
      cell.addEventListener('click', () => {
        const dateStr = cell.getAttribute('data-date');
        openAssignmentModal({ dueDate: `${dateStr}T23:59:00` });
      });
    });
  }

      { id: 4, name: 'Thu' },

    ];

      '08:00', '09:00', '10:00', '11:00', '12:00', '13:00', '14:00', '15:00', '16:00'
    ];

      <div class="section-header">

          <h1 class="section-title">Weekly Timetable</h1>
          <p class="section-subtitle">Weekly recurring class schedule and lecture times.</p>
        </div>

          <button class="btn-primary" id="btn-add-schedule-slot">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
            <span>Add Class Slot</span>

            }).join('')}
          `).join('')}
        </div>

    container.querySelectorAll('.timetable-class-block').forEach(block => {

          showToast('Schedule slot removed', 'info');
        }
      });
    });

      </div>

    container.querySelector('#btn-calculate-whatif')?.addEventListener('click', () => {

      const target = Number(container.querySelector('#sim-target-score').value) || 90;
      const weight = Number(container.querySelector('#sim-weight-score').value) || 25;

      const resBox = container.querySelector('#sim-result-container');

      resBox.style.display = 'block';
      const isDoable = result.requiredScore <= 100 && result.requiredScore >= 0;

      resBox.innerHTML = `

          Simulation Result

          ${isDoable ? '✓ This target is mathematically achievable!' : '⚠️ This required score exceeds 100% based on current weighting.'}
        </div>
      `;
    });
  }

      store.updateSettings({ theme: 'dark' });
      applyTheme('dark');
      showToast('Dark theme applied', 'info');
    });

      showToast('iCal calendar downloaded!', 'success');
    });

    container.querySelector('#btn-export-json')?.addEventListener('click', () => {
      const jsonStr = JSON.stringify(store.getState(), null, 2);
      downloadFile(jsonStr, 'academiapro-backup.json', 'application/json');
      showToast('JSON backup downloaded!', 'success');
    });

    const importInput = container.querySelector('#input-import-json');
    if (importInput) {
      importInput.addEventListener('change', (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = (event) => {
          try {
            const parsed = JSON.parse(event.target.result);
            store.data = store.validateAndMigrate(parsed);
            store.saveToStorage(store.data);
            store.notify('data_imported');
            showToast('Data restored successfully!', 'success');
            renderSettingsView();
          } catch (err) {
            alert('Failed to parse backup JSON file: ' + err.message);
          }
        };
        reader.readAsText(file);
      });
    }

  // --- VIEW: FOCUS TIMER & POMODORO ---
  function renderFocusTimerView() {
    const container = document.getElementById('view-focus');
    if (!container) return;

    const data = store.getState();
    const settings = data.pomodoro?.settings || { workDuration: 25, shortBreak: 5, longBreak: 15, sessionsBeforeLong: 4 };
    const timer = state.pomodoroTimer;
    const classes = store.getClasses();

    const mins = Math.floor(timer.timeRemaining / 60);
    const secs = timer.timeRemaining % 60;
    const timeStr = `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;

    let total = settings.workDuration * 60;
    if (timer.currentPhase === 'shortBreak') total = settings.shortBreak * 60;
    if (timer.currentPhase === 'longBreak') total = settings.longBreak * 60;
    const progress = Math.max(0, Math.min(100, ((total - timer.timeRemaining) / total) * 100));

    const phaseLabel = timer.currentPhase === 'work' 
      ? 'Focus Session' 
      : (timer.currentPhase === 'shortBreak' ? 'Short Break' : 'Long Break');

    const linkedClass = classes.find(c => c.id === timer.linkedClassId);

    container.innerHTML = `

            <option value="">No Course Tagged (General Focus)</option>
            ${classes.map(c => `<option value="${c.id}" ${timer.linkedClassId === c.id ? 'selected' : ''}>📚 ${escapeHTML(c.name)}</option>`).join('')}
          </select>
        </div>

        <div class="pomodoro-controls">
          ${!timer.isRunning 
            ? `<button class="btn-primary pomodoro-control-btn" id="btn-focus-start">▶ Start Focus</button>`

            <span class="stat-subtext">+25 XP per session completed</span>
          </div>

  // --- VIEW: ACADEMIC ANALYTICS & GAMIFICATION ---
  function renderAnalyticsView() {
    const container = document.getElementById('view-analytics');
    if (!container) return;

    const data = store.getState();
    const streaks = data.streaks || { currentStreak: 0, longestStreak: 0, totalXP: 0, level: 1, achievements: [], dailyLog: {} };
    const assignments = store.getAssignments();
    const completed = assignments.filter(a => a.status === 'completed').length;
    const total = assignments.length;
    const completionRate = total > 0 ? Math.round((completed / total) * 100) : 0;

    // XP Progress Calculation
    const currentXP = streaks.totalXP || 0;
    const currentLevel = streaks.level || (Math.floor(currentXP / 500) + 1);
    const xpInCurrentLevel = currentXP % 500;
    const xpProgressPercent = Math.min(100, Math.round((xpInCurrentLevel / 500) * 100));
    const levelTitle = getLevelTitle(currentLevel);

    // Generate 12-week activity heatmap (84 days)
    let heatmapHTML = '<div class="streak-heatmap">';
    const today = new Date();
    for (let i = 83; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().split('T')[0];
      const log = streaks.dailyLog?.[dateStr];
      const tasksCount = log?.tasksCompleted || 0;
      const focusMin = log?.focusMinutes || 0;
      const intensity = (tasksCount > 0 || focusMin > 0)
        ? Math.min(4, Math.max(1, Math.ceil((tasksCount * 2 + focusMin / 15) / 2)))
        : 0;
      const label = `${dateStr}: ${tasksCount} task${tasksCount !== 1 ? 's' : ''}, ${focusMin} min focus`;
      heatmapHTML += `<div class="heatmap-cell intensity-${intensity}" title="${label}"></div>`;
    }
    heatmapHTML += '</div>';

    const badgesList = [
      { id: 'first_task', icon: '🚀', title: 'Getting Started', desc: 'Completed first task' },
      { id: 'streak_3', icon: '🔥', title: 'On a Roll', desc: '3-day study streak' },
      { id: 'streak_7', icon: '⚡', title: 'Weekly Warrior', desc: '7-day study streak' },
      { id: 'streak_30', icon: '👑', title: 'Monthly Master', desc: '30-day study streak' },
      { id: 'focus_60', icon: '🧠', title: 'Deep Focus', desc: '60+ min focus logged' },
      { id: 'tasks_5', icon: '✅', title: 'Task Crusher', desc: '5 assignments done' },
      { id: 'tasks_25', icon: '🌟', title: 'Academic Engine', desc: '25 assignments done' },
      { id: 'full_schedule', icon: '📚', title: 'Full Schedule', desc: '4+ courses enrolled' }
    ];

    let badgesHTML = '';
    badgesList.forEach(b => {
      const unlocked = Array.isArray(streaks.achievements) && streaks.achievements.includes(b.id);
      badgesHTML += `
        <div class="achievement-card ${unlocked ? 'unlocked' : 'locked'}" title="${b.desc}">
          <div class="achievement-icon">${b.icon}</div>
          <div class="achievement-title">${b.title}</div>
          <div class="achievement-desc">${b.desc}</div>
          <span class="achievement-badge-pill">${unlocked ? '✓ Unlocked' : 'Locked'}</span>
        </div>
      `;
    });

    container.innerHTML = `
      <div class="section-header">
        <div>
          <h1 class="section-title">Academic Analytics & Streaks</h1>
          <p class="section-subtitle">Workload distribution, gamified study streak, and milestone achievements.</p>
        </div>
      </div>

      <!-- Streaks & Level Hero Card -->
      <div class="streak-hero-card" style="margin-bottom: 1.5rem;">
        <div class="streak-metrics-row">
          <div>
            <div class="streak-metric-val" style="color: var(--warning);">${streaks.currentStreak || 0}</div>
            <div class="streak-metric-label">Current Streak 🔥</div>
          </div>
          <div>
            <div class="streak-metric-val" style="color: var(--text-primary);">${streaks.longestStreak || 0}</div>
            <div class="streak-metric-label">Longest Streak ⚡</div>
          </div>
          <div>
            <div class="streak-metric-val" style="color: var(--accent);">${completionRate}%</div>
            <div class="streak-metric-label">Task Completion Rate 📈</div>
          </div>
        </div>

        <div class="xp-progress-wrapper">
          <div class="xp-progress-header">
            <div class="xp-level-title">
              <span>🎖️</span> Level ${currentLevel} · ${levelTitle}
            </div>
            <div class="xp-points-text">${xpInCurrentLevel} / 500 XP (${currentXP} Total XP)</div>
          </div>
          <div class="xp-progress-bar">
            <div class="xp-progress-fill" style="width: ${xpProgressPercent}%;"></div>
          </div>
        </div>
      </div>

      <!-- Activity Heatmap Panel -->
      <div class="card-panel" style="margin-bottom: 1.5rem;">
        <div class="panel-header">
          <h3 class="panel-title">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
            12-Week Study & Task Heatmap

  // --- MODALS ENGINE ---

  function openModalHTML(htmlContent, onRenderCallback) {
    if (!elements.modalContainer || !elements.modalOverlay) return;
    elements.modalContainer.innerHTML = htmlContent;
    elements.modalOverlay.classList.add('active');
    state.modalContext = true;

    const closeBtn = elements.modalContainer.querySelector('#modal-close');
    if (closeBtn) closeBtn.addEventListener('click', closeModal);

    elements.modalOverlay.onclick = (e) => {
      if (e.target === elements.modalOverlay) closeModal();
    };

    if (typeof onRenderCallback === 'function') {
      onRenderCallback(elements.modalContainer);
    }
  }

  function closeModal() {
    if (elements.modalOverlay) elements.modalOverlay.classList.remove('active');
    if (elements.modalContainer) elements.modalContainer.innerHTML = '';
    state.modalContext = null;
  }

        box.style.display = 'block';
        box.style.background = isError ? 'rgba(239, 68, 68, 0.1)' : 'rgba(16, 185, 129, 0.1)';
        box.style.color = isError ? 'var(--danger)' : 'var(--success)';
        box.style.border = isError ? '1px solid rgba(239, 68, 68, 0.3)' : '1px solid rgba(16, 185, 129, 0.3)';
        box.textContent = msg;
      };

      // Tab Switcher

          dialog.querySelectorAll('.auth-tab-btn').forEach(b => b.classList.remove('active'));

        e.preventDefault();
        const name = dialog.querySelector('#signup-name').value.trim();
        const email = dialog.querySelector('#signup-email').value.trim();
        const password = dialog.querySelector('#signup-password').value;
        const confirmPw = dialog.querySelector('#signup-password-confirm').value;
        const btn = dialog.querySelector('#btn-submit-signup');

        if (password !== confirmPw) {
          showAlert('Passwords do not match.', true);
          return;
        }

        btn.textContent = 'Creating account...';
        btn.disabled = true;

        try {
          await FirebaseSyncService.signUp(email, password, name);
          store.updateSettings({ studentName: name, isProfileConfigured: true });
          showToast('Account created! Data now syncing with Cloud.', 'success');
          closeModal();
        } catch (err) {
          showAlert(err.message || 'Registration failed.', true);
          btn.textContent = 'Create Free Account & Sync';
          btn.disabled = false;
        }
      });

      dialog.querySelector('#link-forgot-pw')?.addEventListener('click', async (e) => {
        e.preventDefault();
        const email = dialog.querySelector('#signin-email')?.value.trim();
        if (!email) {
          showAlert('Please enter your email address in the field above first.', true);
          return;
        }
        try {
          await FirebaseSyncService.sendPasswordReset(email);
          showAlert(`Password reset link sent to ${email}! Check your inbox.`, false);
        } catch (err) {
          showAlert(err.message || 'Could not send reset link.', true);
        }
      });

      // Anonymous / Guest Login Handler
      dialog.querySelector('#btn-guest-login')?.addEventListener('click', async () => {
        const btn = dialog.querySelector('#btn-guest-login');
        btn.textContent = 'Connecting guest session...';
        btn.disabled = true;
        try {
          await FirebaseSyncService.signInAnonymously();
          showToast('Guest cloud session activated!', 'success');
          closeModal();
        } catch (err) {
          showAlert(err.message || 'Guest sign-in failed. Make sure Anonymous auth is enabled in Firebase Console.', true);
          btn.textContent = '⚡ Continue as Anonymous Guest';
          btn.disabled = false;
        }
      });

      // Firebase Config Form Handler
      const configForm = dialog.querySelector('#form-firebase-config');
      const pasteJson = dialog.querySelector('#cfg-paste-json');

      pasteJson?.addEventListener('input', () => {
        const raw = pasteJson.value.trim();
        if (!raw) return;
        try {
          // Clean possible js assignment e.g. const firebaseConfig = { ... };
          let cleanStr = raw;
          if (cleanStr.includes('=')) {
            cleanStr = cleanStr.slice(cleanStr.indexOf('=') + 1);
          }
          if (cleanStr.endsWith(';')) {
            cleanStr = cleanStr.slice(0, -1);
          }
          cleanStr = cleanStr.trim();

          // Try relaxed JSON or Function parse
          let parsed;
          try {
            parsed = JSON.parse(cleanStr);
          } catch (jsonErr) {
            parsed = (new Function(`return ${cleanStr}`))();
          }

          if (parsed && typeof parsed === 'object') {
            if (parsed.apiKey) dialog.querySelector('#cfg-api-key').value = parsed.apiKey;
            if (parsed.projectId) dialog.querySelector('#cfg-project-id').value = parsed.projectId;
            if (parsed.authDomain) dialog.querySelector('#cfg-auth-domain').value = parsed.authDomain;
            if (parsed.appId) dialog.querySelector('#cfg-app-id').value = parsed.appId;
            showAlert('Config recognized! Click "Save & Connect" below.', false);
          }
        } catch (e) {
          // Ignore partial typing errors
        }
      });

      configForm?.addEventListener('submit', (e) => {
        e.preventDefault();
        const apiKey = dialog.querySelector('#cfg-api-key').value.trim();
        const projectId = dialog.querySelector('#cfg-project-id').value.trim();
        const authDomain = dialog.querySelector('#cfg-auth-domain').value.trim() || `${projectId}.firebaseapp.com`;
        const appId = dialog.querySelector('#cfg-app-id').value.trim();

        if (!apiKey || !projectId) {
          showAlert('Please provide at least an API Key and Project ID.', true);
          return;
        }

        const newConfig = {
          apiKey,
          projectId,
          authDomain,
          appId,
          storageBucket: `${projectId}.appspot.com`
        };

        const success = FirebaseSyncService.saveConfig(newConfig);
        if (success) {
          showToast('Firebase configuration saved!', 'success');
          openAccountSyncModal('signin');
        } else {
          showAlert('Saved keys, but could not connect to Firebase SDK. Check console for details.', true);
        }
      });

      dialog.querySelector('#btn-clear-cfg')?.addEventListener('click', () => {
        if (confirm('Clear saved Firebase configuration?')) {
          FirebaseSyncService.saveConfig(null);
          showToast('Firebase configuration removed', 'info');
          closeModal();
        }
      });
    });
  }

  const PS_BOOKMARKLET_CODE = "javascript:void(function(){try{var classes=[];var studentName='';var wel=document.querySelector('#user-greeting,#welcome-text,.user-greeting,.username,#branding-student-name,.student-name,h1,h2');if(wel){var wm=wel.textContent.match(/Welcome,\\s+([A-Za-z\\s]+?)(?:\\s+Help|\\s+Sign Out|\\n|$)/i)||wel.textContent.match(/Grades and Attendance:\\s*([A-Za-z]+,\\s*[A-Za-z\\s]+)/i);if(wm){studentName=wm[1].trim()}}var rows=document.querySelectorAll('table.linkDescList tr.highlight,table.linkDescList tr,#quickLookup table tr,table[border] tr,.box-round table tr,#grades-table tr,.data-table tr,#content-main table tr');if(!rows.length){rows=document.querySelectorAll('tr');}var seen={};rows.forEach(function(row){var cells=row.querySelectorAll('td');if(cells.length<3)return;var period='';var name='';var grade=null;var teacher='';var room='';var c0=cells[0]?cells[0].textContent.trim():'';if(c0.match(/^\\d+(\\([A-Za-z0-9]+\\))?/)){period=c0}for(var i=0;i<cells.length;i++){var txt=cells[i].textContent.trim();if(!name&&txt.length>2&&!/^\\d+$/.test(txt)&&!txt.match(/^[A-F][+-]?$/)&&!txt.match(/^\\d+\\.?\\d*%?$/)&&!txt.includes('Not available')&&txt!=='[ i ]'&&txt!=='.'){name=txt}var gm=txt.match(/(\\d{1,3}(?:\\.\\d+)?)\\s*%/);if(gm&&grade===null){grade=parseFloat(gm[1])}else if(grade===null&&/^\\d{1,3}(\\.\\d+)?$/.test(txt)&&parseFloat(txt)>=0&&parseFloat(txt)<=150&&txt!==room&&!txt.match(/^\\d{4}$/)){grade=parseFloat(txt)}if(!teacher){var tm=txt.match(/Email\\s+([A-Za-z\\s,.\\-0-9]+?)(?:\\r?\\n|\\t|- Rm|$)/i);if(tm)teacher=tm[1].trim()}if(!room){var rm=txt.match(/Rm:\\s*(\\d+[A-Za-z]?|[A-Za-z0-9\\-]+)/i);if(rm)room=rm[1].trim()}}if(name&&!seen[name]){seen[name]=1;classes.push({className:name,period:period,teacher:teacher,room:room,gradePercent:grade,gradeLetter:null});}});var result=JSON.stringify({source:'powerschool',version:1,studentName:studentName,exportedAt:new Date().toISOString(),classes:classes},null,2);if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(result).then(function(){alert('AcademiaPro: '+classes.length+' classes copied to clipboard!\\nGo to AcademiaPro Settings > Import from PowerSchool > Paste.')}).catch(function(){prompt('Copy this JSON manually:',result)})}else{prompt('Copy this JSON manually:',result)}}catch(e){alert('PowerSchool scraper error: '+e.message)}})();";

  function cleanCourseName(rawName) {
    if (!rawName) return '';
    return rawName
      .replace(/^[\d\s()A-Za-z]+[-:]\s*/, '')
      .replace(/Email.*$/i, '')
      .replace(/-\s*Rm:.*$/i, '')
      .replace(/\s*\.\s*$/, '')
      .trim();
  }

  function findBestMatchingClass(psName, existingList) {
    if (!existingList || !existingList.length) return null;
    const clean = psName.toLowerCase().replace(/[^a-z0-9]/g, ' ');
    const tokens = clean.split(/\s+/).filter(t => t.length > 2 && t !== 'preap' && t !== 'dch' && t !== 'stdy');

    let bestMatch = null;
    let bestScore = 0;

    for (const cls of existingList) {
      const existingClean = cls.name.toLowerCase().replace(/[^a-z0-9]/g, ' ');
      const existingTokens = existingClean.split(/\s+/).filter(t => t.length > 2);

      if (existingClean === clean || existingClean.includes(clean) || clean.includes(existingClean)) {
        return cls;
      }

      let score = 0;
      for (const t of tokens) {
        if (existingTokens.includes(t) || existingClean.includes(t)) {
          score += 2;
        }
      }
      if (score > bestScore && score >= 2) {
        bestScore = score;
        bestMatch = cls;
      }
    }

    return bestMatch;
  }

    let parsedClasses = [];

    openModalHTML(html, dialog => {
      const pasteInput = dialog.querySelector('#ps-paste-input');
      const previewArea = dialog.querySelector('#ps-preview-area');
      const previewList = dialog.querySelector('#ps-preview-list');
      const gpaHeroContainer = dialog.querySelector('#ps-gpa-hero-container');
      const parseBtn = dialog.querySelector('#btn-ps-parse');
      const clearBtn = dialog.querySelector('#btn-ps-clear');
      const confirmBtn = dialog.querySelector('#btn-ps-confirm');
      const cancelBtn = dialog.querySelector('#btn-ps-cancel');
      const studentBanner = dialog.querySelector('#ps-student-banner');

      const studentNameCheck = dialog.querySelector('#ps-apply-student-name');
      const countSummary = dialog.querySelector('#ps-count-summary');

      clearBtn?.addEventListener('click', () => {
        if (pasteInput) pasteInput.value = '';
        if (previewArea) previewArea.style.display = 'none';
        parsedClasses = [];

      });

      cancelBtn?.addEventListener('click', closeModal);

      parseBtn?.addEventListener('click', () => {
        const raw = (pasteInput?.value || '').trim();
        if (!raw) {
          showToast('Please paste your PowerSchool text or JSON first', 'danger');
          return;
        }

        const result = parsePowerSchoolInput(raw);
        parsedClasses = (result.classes || []).map(pc => ({
          ...pc,
          courseLevel: pc.courseLevel || store.detectCourseLevel(pc.className),
          credits: pc.credits || 3
        }));
        detectedStudentName = result.studentName || null;

        if (!parsedClasses.length) {
          showToast('Could not find any classes in the pasted text. Please make sure you copied the Grades and Attendance table.', 'danger');
          if (previewArea) previewArea.style.display = 'none';
          if (confirmBtn) confirmBtn.disabled = true;
          return;
        }

        // Show student name banner if detected
        if (detectedStudentName && studentBanner && studentNameDisplay) {
          studentNameDisplay.textContent = detectedStudentName;
          studentBanner.style.display = 'flex';
        } else if (studentBanner) {
          studentBanner.style.display = 'none';
        }

        // Auto-match against existing classes
        applySmartMatch();
        renderPreview();
        previewArea.style.display = 'block';

        const gpa = calculatePreviewGPA();
        const gpaMsg = gpa.weightedGpa !== null 
          ? ` (Weighted GPA: ${gpa.weightedGpa.toFixed(2)} / 5.00)` 
          : '';
        showToast(`Parsed ${parsedClasses.length} class${parsedClasses.length !== 1 ? 'es' : ''}${gpaMsg}!`, 'success');
      });

      function calculatePreviewGPA() {
        let totalUnweightedPoints = 0;
        let totalWeightedPoints = 0;
        let totalCredits = 0;
        let gradedCount = 0;
        let weightedCount = 0;
        let apCount = 0;
        let preApCount = 0;
        let regularCount = 0;
        const letterCounts = { A: 0, B: 0, C: 0, D: 0, F: 0 };

        parsedClasses.forEach(pc => {
          if (pc._action === 'skip') return;
          if (pc.gradePercent === null || pc.gradePercent === undefined) return;

          const letter = store.percentageToLetter(pc.gradePercent);
          const unweightedPoints = store.letterToGpaPoints(letter);
          const level = pc.courseLevel || store.detectCourseLevel(pc.className);
          const boost = store.getLevelWeightBoost(level);
          const weightedPoints = unweightedPoints > 0 ? Math.min(5.0, unweightedPoints + boost) : 0;
          const credits = pc.credits || 3;

          totalUnweightedPoints += (unweightedPoints * credits);
          totalWeightedPoints += (weightedPoints * credits);
          totalCredits += credits;
          gradedCount++;

          if (boost > 0) {
            weightedCount++;
            if (String(level).toUpperCase().includes('PRE')) {
              preApCount++;
            } else {
              apCount++;
            }
          } else {
            regularCount++;
          }

          const baseLetter = letter[0];
          if (letterCounts[baseLetter] !== undefined) {
            letterCounts[baseLetter]++;
          }
        });

        const unweightedGpa = totalCredits > 0 ? (totalUnweightedPoints / totalCredits) : null;
        const weightedGpa = totalCredits > 0 ? (totalWeightedPoints / totalCredits) : null;

        return {
          unweightedGpa: unweightedGpa !== null ? Math.round(unweightedGpa * 100) / 100 : null,
          weightedGpa: weightedGpa !== null ? Math.round(weightedGpa * 100) / 100 : null,
          totalCredits,
          gradedCount,
          weightedCount,
          apCount,
          preApCount,
          regularCount,
          letterCounts
        };
      }

      function applySmartMatch() {
        parsedClasses.forEach(pc => {
          const match = findBestMatchingClass(pc.className, existingClasses);
          if (match) {
            pc._action = `update:${match.id}`;
            pc._matchedClass = match;
            if (match.courseLevel) {
              pc.courseLevel = match.courseLevel;
            } else {
              const remembered = store.getRememberedCourseLevel(pc.className);
              if (remembered) pc.courseLevel = remembered;
            }
          } else {
            pc._action = 'new';
            pc._matchedClass = null;
            const remembered = store.getRememberedCourseLevel(pc.className);
            if (remembered) pc.courseLevel = remembered;
          }
        });
      }

      function applyGradesOnlyMode() {
        parsedClasses.forEach(pc => {
          const match = findBestMatchingClass(pc.className, existingClasses);
          if (match) {
            pc._action = `update:${match.id}`;
            pc._matchedClass = match;
            if (match.courseLevel) {
              pc.courseLevel = match.courseLevel;
            } else {
              const remembered = store.getRememberedCourseLevel(pc.className);
              if (remembered) pc.courseLevel = remembered;
            }
          } else {
            pc._action = 'skip';
            pc._matchedClass = null;
          }
        });
      }

      function applyAllNewMode() {
        parsedClasses.forEach(pc => {
          pc._action = 'new';
        });
      }

      dialog.querySelector('#btn-mode-smart')?.addEventListener('click', () => {
        applySmartMatch();
        renderPreview();
      });

      dialog.querySelector('#btn-mode-grades-only')?.addEventListener('click', () => {
        applyGradesOnlyMode();
        renderPreview();
      });

      dialog.querySelector('#btn-mode-all-new')?.addEventListener('click', () => {
        applyAllNewMode();
        renderPreview();
      });

      function renderPreview() {
        if (!previewList) return;

        const previewGPA = calculatePreviewGPA();

        // Render Live GPA Hero Card
        if (gpaHeroContainer) {
          gpaHeroContainer.innerHTML = `
            <div class="ps-gpa-summary-card">
              <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:1rem;">
                <div>
                  <div style="font-size:0.6875rem; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--accent);">
                    🔥 PowerSchool Projected Weighted GPA
                  </div>
                  <div style="font-size:2.25rem; font-weight:900; color:var(--text-primary); line-height:1.1; margin:0.25rem 0;">
                    ${previewGPA.weightedGpa !== null ? previewGPA.weightedGpa.toFixed(2) : '—'} <span style="font-size:0.9375rem; font-weight:600; color:var(--text-muted);">/ 5.00 Max</span>
                  </div>
                  <div style="font-size:0.75rem; color:var(--text-secondary); display:flex; gap:0.375rem; align-items:center; flex-wrap:wrap;">
                    ${previewGPA.preApCount > 0 ? `<span class="ps-level-badge preap">${previewGPA.preApCount} Pre-AP (5.0)</span>` : ''}
                    ${previewGPA.apCount > 0 ? `<span class="ps-level-badge ap">${previewGPA.apCount} AP (5.0)</span>` : ''}
                    <span class="ps-level-badge regular">${previewGPA.regularCount} Regular (4.0)</span>
                  </div>
                </div>

                <div style="text-align:right; border-left:1px solid var(--border-default); padding-left:1.25rem;">
                  <div style="font-size:0.6875rem; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-muted);">
                    Unweighted GPA
                  </div>
                  <div style="font-size:1.75rem; font-weight:800; color:var(--text-primary); line-height:1.1; margin:0.25rem 0;">
                    ${previewGPA.unweightedGpa !== null ? previewGPA.unweightedGpa.toFixed(2) : '—'} <span style="font-size:0.875rem; font-weight:500; color:var(--text-muted);">/ 4.00</span>
                  </div>
                  <div style="font-size:0.75rem; color:var(--text-secondary);">
                    ${previewGPA.gradedCount} graded courses · ${previewGPA.letterCounts.A || 0} A${previewGPA.letterCounts.A !== 1 ? "'s" : ''}, ${previewGPA.letterCounts.B || 0} B${previewGPA.letterCounts.B !== 1 ? "'s" : ''}
                  </div>
                </div>
              </div>
            </div>
          `;
        }

        let activeCount = 0;
        let newCount = 0;
        let updateCount = 0;

        previewList.innerHTML = parsedClasses.map((pc, idx) => {
          const isSkipped = pc._action === 'skip';
          if (!isSkipped) {
            activeCount++;
            if (pc._action === 'new') newCount++;
            if (pc._action.startsWith('update:')) updateCount++;
          }

          const gradeBadge = pc.gradePercent !== null && pc.gradePercent !== undefined
            ? `<span style="display:inline-block; padding:0.15rem 0.55rem; border-radius:9999px; font-weight:700; font-size:0.75rem; background:${pc.gradePercent >= 90 ? 'rgba(16, 185, 129, 0.15)' : pc.gradePercent >= 70 ? 'rgba(245, 158, 11, 0.15)' : 'rgba(239, 68, 68, 0.15)'}; color:${pc.gradePercent >= 90 ? 'var(--success)' : pc.gradePercent >= 70 ? 'var(--warning)' : 'var(--danger)'};">${pc.gradePercent}% (${store.percentageToLetter(pc.gradePercent)})</span>`
            : `<span style="display:inline-block; padding:0.15rem 0.55rem; border-radius:9999px; font-size:0.6875rem; background:var(--bg-surface); color:var(--text-tertiary); border:1px solid var(--border-default);">No grade posted</span>`;

          const metaPills = [
            pc.period ? `<span style="background:var(--bg-surface); padding:0.1rem 0.375rem; border-radius:4px; border:1px solid var(--border-default);">Period ${escapeHTML(pc.period)}</span>` : '',
            pc.room ? `<span style="background:var(--bg-surface); padding:0.1rem 0.375rem; border-radius:4px; border:1px solid var(--border-default);">Rm ${escapeHTML(pc.room)}</span>` : '',

          return `
            <div style="padding:0.75rem; border-bottom:1px solid var(--border-default); display:flex; flex-direction:column; gap:0.5rem; ${isSkipped ? 'opacity:0.45; background:var(--bg-surface-subtle);' : ''}">
              <div style="display:flex; align-items:center; justify-content:space-between; gap:0.5rem;">
                <div style="display:flex; align-items:center; gap:0.5rem; min-width:0;">

                </div>
                <div>${gradeBadge}</div>
              </div>
              
              <div style="display:flex; align-items:center; justify-content:space-between; gap:0.5rem; flex-wrap:wrap; font-size:0.6875rem; color:var(--text-secondary); padding-left:1.5rem;">
                <div>${metaPills || 'Standard Class'}</div>
                
                <div style="display:flex; align-items:center; gap:0.5rem; flex-wrap:wrap;">
                  <!-- Course Level Selector (Weighted Boost) -->
                  <div style="display:flex; align-items:center; gap:0.25rem;">
                    <label style="font-size:0.6875rem; color:var(--text-tertiary); font-weight:600;">Scale:</label>
                    <select class="ps-level-select" id="ps-class-level-${idx}" data-idx="${idx}">
                      <option value="Pre-AP" ${String(pc.courseLevel).toUpperCase().includes('PRE') ? 'selected' : ''}>Pre-AP (5.0 Scale · +1.0)</option>
                      <option value="AP" ${(pc.courseLevel === 'AP' || pc.courseLevel === 'IB' || pc.courseLevel === 'Dual Credit' || pc.courseLevel === 'College') ? 'selected' : ''}>AP / IB (5.0 Scale · +1.0)</option>
                      <option value="Regular" ${pc.courseLevel === 'Regular' ? 'selected' : ''}>Regular (4.0 Scale)</option>
                    </select>
                  </div>

                  <!-- Action Selector -->
                  <div style="display:flex; align-items:center; gap:0.25rem;">
                    <label style="font-size:0.6875rem; color:var(--text-tertiary); font-weight:600;">Action:</label>
                    <select id="ps-class-action-${idx}" data-idx="${idx}" style="font-size:0.6875rem; padding:0.25rem 0.5rem; border-radius:var(--radius-sm); border:1px solid var(--border-default); background:var(--bg-surface); color:var(--text-primary); max-width:200px;">
                      <option value="new" ${pc._action === 'new' ? 'selected' : ''}>➕ Create as New Class</option>
                      ${existingClasses.map(ec => `
                        <option value="update:${ec.id}" ${pc._action === `update:${ec.id}` ? 'selected' : ''}>
                          🔄 Update: ${escapeHTML(ec.name)}
                        </option>
                      `).join('')}
                      <option value="skip" ${pc._action === 'skip' ? 'selected' : ''}>🚫 Skip / Ignore</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>
          `;
        }).join('');

        if (countSummary) {
          countSummary.textContent = `${newCount} new, ${updateCount} to update, ${parsedClasses.length - activeCount} skipped`;
        }

        if (confirmBtn) {
          confirmBtn.disabled = activeCount === 0;
          confirmBtn.textContent = `✅ Import ${activeCount} Course${activeCount !== 1 ? 's' : ''}`;
        }

        // Wire change listeners
        previewList.querySelectorAll('input[type="checkbox"]').forEach(cb => {
          cb.addEventListener('change', () => {
            const idx = parseInt(cb.dataset.idx);
            if (!isNaN(idx) && parsedClasses[idx]) {
              if (cb.checked) {
                const match = findBestMatchingClass(parsedClasses[idx].className, existingClasses);
                parsedClasses[idx]._action = match ? `update:${match.id}` : 'new';
              } else {
                parsedClasses[idx]._action = 'skip';
              }
              renderPreview();
            }
          });
        });

        previewList.querySelectorAll('.ps-level-select').forEach(sel => {
          sel.addEventListener('change', () => {
            const idx = parseInt(sel.dataset.idx);
            if (!isNaN(idx) && parsedClasses[idx]) {
              parsedClasses[idx].courseLevel = sel.value;
              store.rememberCourseLevel(parsedClasses[idx].className, sel.value);
              renderPreview();
            }
          });
        });

        previewList.querySelectorAll('select:not(.ps-level-select)').forEach(sel => {
          sel.addEventListener('change', () => {
            const idx = parseInt(sel.dataset.idx);
            if (!isNaN(idx) && parsedClasses[idx]) {
              parsedClasses[idx]._action = sel.value;
              renderPreview();
            }
          });
        });
      }

      confirmBtn?.addEventListener('click', () => {
        let createdCount = 0;
        let updatedGradeCount = 0;

        // Apply student profile name if checked
        if (detectedStudentName && studentNameCheck && studentNameCheck.checked) {
          store.updateSettings({ studentName: detectedStudentName });
        }

        parsedClasses.forEach((pc, i) => {
          if (pc._action === 'skip') return;

          // Save choice to memory for all future imports & updates
          store.rememberCourseLevel(pc.className, pc.courseLevel);

          if (pc._action.startsWith('update:')) {
            // Update grades on existing class (NO NEW CLASS CREATED)
            const targetClassId = pc._action.replace('update:', '');
            const targetClass = store.getClassById(targetClassId);
            if (!targetClass) return;

            const updates = {
              courseLevel: pc.courseLevel || store.detectCourseLevel(targetClass.name)
            };
            if (!targetClass.teacher && pc.teacher) updates.teacher = pc.teacher;
            if (!targetClass.room && pc.room) updates.room = pc.room;
            store.updateClass(targetClassId, updates);
            store.rememberCourseLevel(targetClass.name, updates.courseLevel);

            // Record / Update Grade Snapshot if gradePercent is present
            if (pc.gradePercent !== null && pc.gradePercent !== undefined) {
              const classAsgs = store.getAssignments().filter(a => a.classId === targetClassId);
              const existingSnapshot = classAsgs.find(a => 
                a.title.includes('PowerSchool Current Grade') || a.title.includes('Current Grade Snapshot')
              );

              const categoryId = (targetClass.gradeCategories && targetClass.gradeCategories[0] && targetClass.gradeCategories[0].id) || null;

              if (existingSnapshot) {
                store.updateAssignment(existingSnapshot.id, {
                  scoreEarned: pc.gradePercent,
                  maxScore: 100,
                  completionPercentage: 100,
                  status: 'completed',
                  notes: `Updated from PowerSchool on ${new Date().toLocaleDateString()}`
                });
              } else {
                store.addAssignment({
                  classId: targetClassId,
                  title: 'PowerSchool Current Grade Snapshot',
                  description: `Imported grade from PowerSchool on ${new Date().toLocaleDateString()}`,
                  type: 'homework',
                  dueDate: new Date().toISOString(),
                  priority: 'medium',
                  status: 'completed',
                  completionPercentage: 100,
                  gradeCategoryId: categoryId,
                  scoreEarned: pc.gradePercent,
                  maxScore: 100,
                  subtasks: [],
                  notes: pc.gradeLetter ? `Letter grade: ${pc.gradeLetter}` : ''
                });
              }
              updatedGradeCount++;
            }
          } else if (pc._action === 'new') {
            // Create new class with detected/chosen courseLevel
            const catTimestamp = Date.now() + i;
            const gradeCategories = [
              { id: 'gc-hw-' + catTimestamp, name: 'Homework & Assignments', weight: 30 },
              { id: 'gc-quiz-' + catTimestamp, name: 'Quizzes', weight: 20 },
              { id: 'gc-exam-' + catTimestamp, name: 'Tests & Exams', weight: 35 },
              { id: 'gc-part-' + catTimestamp, name: 'Participation & Classwork', weight: 15 }
            ];

            const colorIdx = store.getClasses().length;
            const newClass = store.addClass({
              name: pc.className,
              teacher: pc.teacher || '',
              room: pc.room || '',
              color: SUBJECT_COLORS[(colorIdx + i) % SUBJECT_COLORS.length],
              credits: 3,
              courseLevel: pc.courseLevel || store.detectCourseLevel(pc.className),
              gradeCategories: gradeCategories,
              notes: `Imported from PowerSchool${pc.period ? ' (' + pc.period + ')' : ''}${pc.gradePercent !== null ? ' — Current grade: ' + pc.gradePercent + '%' : ''}`
            });
            createdCount++;

            if (pc.gradePercent !== null && pc.gradePercent !== undefined) {
              store.addAssignment({
                classId: newClass.id,
                title: 'PowerSchool Current Grade Snapshot',
                description: `Auto-imported overall grade from PowerSchool on ${new Date().toLocaleDateString()}`,
                type: 'homework',
                dueDate: new Date().toISOString(),
                priority: 'medium',
                status: 'completed',
                completionPercentage: 100,
                gradeCategoryId: gradeCategories[0].id,
                scoreEarned: pc.gradePercent,
                maxScore: 100,
                subtasks: [],
                notes: pc.gradeLetter ? `Letter grade: ${pc.gradeLetter}` : ''
              });
              updatedGradeCount++;
            }
          }
        });

        store.notify('data_imported');
        closeModal();

        const finalGPA = calculatePreviewGPA();
        const gpaSuffix = finalGPA.weightedGpa !== null 
          ? ` · Weighted GPA: ${finalGPA.weightedGpa.toFixed(2)} | Unweighted: ${finalGPA.unweightedGpa.toFixed(2)}` 
          : '';
        showToast(`PowerSchool import complete!${gpaSuffix} 🎉`, 'success');
        navigateTo('grades');
      });
    });
  }

  /**
   * Robust multi-strategy PowerSchool parser handling:
   * 1. Direct Ctrl+A / Ctrl+C raw table text from HISD PowerSchool portal
   * 2. Tab-separated browser table copies
   * 3. PowerSchool Bookmarklet JSON payload
   * 4. Student Name detection from header
   */
  function parsePowerSchoolInput(raw) {
    if (!raw) return { studentName: null, classes: [] };

    let studentName = null;
    const nameMatch = raw.match(/Welcome,\s+([A-Za-z\s]+?)(?:\s+Help|\s+Sign Out|\n)/i) ||
                      raw.match(/Grades and Attendance:\s*([A-Za-z]+,\s*[A-Za-z\s]+)/i);
    if (nameMatch) {
      let n = nameMatch[1].trim();
      if (n.includes(',')) {
        const parts = n.split(',').map(s => s.trim());
        studentName = `${parts[1]} ${parts[0]}`;
      } else {
        studentName = n;
      }
    }

    // Attempt 1: JSON parse (from bookmarklet output)
    try {
      const json = JSON.parse(raw);
      if (json && json.source === 'powerschool' && Array.isArray(json.classes)) {
        return {
          studentName: json.studentName || studentName,
          classes: json.classes.map(c => {
            const cName = cleanCourseName(c.className || c.name || 'Unknown Class');
            return {
              className: cName,
              period: c.period || '',
              teacher: c.teacher || '',
              room: c.room || '',
              courseLevel: c.courseLevel || store.detectCourseLevel(cName),
              credits: c.credits || 3,
              gradePercent: c.gradePercent !== undefined && c.gradePercent !== null ? Number(c.gradePercent) : null,
              gradeLetter: c.gradeLetter || null
            };
          })
        };
      }
      if (Array.isArray(json)) {
        return {
          studentName,
          classes: json.filter(c => c.className || c.name).map(c => {
            const cName = cleanCourseName(c.className || c.name);
            return {
              className: cName,
              period: c.period || '',
              teacher: c.teacher || '',
              room: c.room || '',
              courseLevel: c.courseLevel || store.detectCourseLevel(cName),
              credits: c.credits || 3,
              gradePercent: c.gradePercent !== undefined && c.gradePercent !== null ? Number(c.gradePercent) : null,
              gradeLetter: c.gradeLetter || null
            };
          })
        };
      }
    } catch (e) {}

    // Attempt 2: PowerSchool table block parser (HISD and standard PowerSchool portals)
    const classes = [];
    const lines = raw.split(/\r?\n/);

    // Strategy 1: Sectioning by period markers (e.g. "0(A)", "1(A)", "Period 1", "Per 2")
    const periodIndices = [];
    const periodRegex = /^\s*(\d+\s*\([A-Za-z0-9,\- ]+\)|(?:Period|Per|Block)\s*\d+)/i;

    for (let i = 0; i < lines.length; i++) {
      const m = lines[i].match(periodRegex);
      if (m) {
        periodIndices.push({ lineIndex: i, period: m[1].trim() });
      }
    }

    // Fallback: If no period markers, look for lines with "Email "
    if (periodIndices.length === 0) {
      for (let i = 0; i < lines.length; i++) {
        if (lines[i].includes('Email ')) {
          const prevIdx = Math.max(0, i - 1);
          periodIndices.push({ lineIndex: prevIdx, period: '' });
        }
      }
    }

    if (periodIndices.length > 0) {
      for (let p = 0; p < periodIndices.length; p++) {
        const start = periodIndices[p].lineIndex;
        const end = (p + 1 < periodIndices.length) ? periodIndices[p + 1].lineIndex : lines.length;
        const blockLines = lines.slice(start, end);
        const blockText = blockLines.join('\n');
        const period = periodIndices[p].period;

        let courseName = '';
        let teacher = '';
        let room = '';
        let gradePercent = null;
        let gradeLetter = null;

        // Extract Course Name from line 0 or line 1
        const line0Parts = blockLines[0].split('\t').map(s => s.trim()).filter(Boolean);
        for (let k = line0Parts.length - 1; k >= 0; k--) {
          const part = line0Parts[k];
          if (part && !part.includes('Not available') && part !== '.' && !part.match(/^\d+$/) && !part.match(/^\d+\s*\([A-Za-z0-9,\- ]+\)$/)) {
            courseName = cleanCourseName(part);
            break;
          }
        }

        if (!courseName) {
          for (let j = 0; j < Math.min(blockLines.length, 4); j++) {
            const l = blockLines[j].trim();
            if (l && !l.startsWith('Email') && !l.startsWith('- Rm') && !l.includes('Not available') && !l.match(/^\d+$/)) {
              const clean = l.replace(/^\d+\s*\([A-Za-z0-9,\- ]+\)\s*/, '').replace(/\t+/g, ' ').trim();
              const cleaned = cleanCourseName(clean);
              if (cleaned.length > 2 && !cleaned.toLowerCase().startsWith('attendance')) {
                courseName = cleaned;
                break;
              }
            }
          }
        }

        // Teacher parsing: "Email Morales, Roberto E" -> "Roberto E Morales"
        const teacherMatch = blockText.match(/Email\s+([A-Za-z\s,.\-0-9]+?)(?:\r?\n|\t|- Rm|$)/i);
        if (teacherMatch) {
          let t = teacherMatch[1].trim();
          if (t.toLowerCase().startsWith('teacher')) {
            teacher = '';
          } else if (t.includes(',')) {
            const parts = t.split(',').map(s => s.trim());
            teacher = `${parts[1] || ''} ${parts[0] || ''}`.trim();
          } else {
            teacher = t;
          }
        }

        // Room parsing: "- Rm:\n 3610" or "- Rm: 3610"
        const roomMatch = blockText.match(/-\s*Rm:\s*(\d+[A-Za-z]?|[A-Za-z0-9\-]+)?/i);
        if (roomMatch && roomMatch[1]) {
          room = roomMatch[1].trim();
        } else {
          for (let j = 0; j < blockLines.length; j++) {
            if (blockLines[j].trim() === '- Rm:' && j + 1 < blockLines.length) {
              const nextL = blockLines[j + 1].trim();
              if (nextL.match(/^\d+[A-Za-z]?$/)) {
                room = nextL;
                break;
              }
            }
          }
        }

        // Grade score parsing
        const foundScores = [];
        let pastHeader = false;

        for (let j = 0; j < blockLines.length; j++) {
          const l = blockLines[j].trim();
          if (l.startsWith('Email') || l.startsWith('- Rm:')) {
            pastHeader = true;
            continue;
          }
          if (!pastHeader) continue;
          if (room && l === room) continue;
          if (l.startsWith('Attendance Totals')) break;

          const tokens = l.split(/[\t\s]+/).map(s => s.trim()).filter(Boolean);
          for (const tok of tokens) {
            if (tok === room) continue;
            if (tok === '[ i ]' || tok === 'Not' || tok === 'available' || tok === '.') continue;
            if (/^\d{1,3}(?:\.\d+)?$/.test(tok)) {
              foundScores.push(parseFloat(tok));
            }
          }
        }

        if (foundScores.length > 0) {
          let gradeCandidates = [];
          if (foundScores.length >= 2 && foundScores[foundScores.length - 1] === 0 && foundScores[foundScores.length - 2] === 0) {
            gradeCandidates = foundScores.slice(0, foundScores.length - 2);
          } else {
            gradeCandidates = foundScores;
          }

          if (gradeCandidates.length > 0) {
            gradePercent = gradeCandidates[0];
          }
        }

        if (courseName) {
          if (courseName.length > 1 && !courseName.toLowerCase().startsWith('attendance totals')) {
            classes.push({
              className: courseName,
              period: period || '',
              teacher: teacher || '',
              room: room || '',
              courseLevel: store.detectCourseLevel(courseName),
              credits: 3,
              gradePercent: gradePercent,
              gradeLetter: gradeLetter
            });
          }
        }
      }
    }

    // Strategy 2: Tab-separated table parser (if period sectioning found nothing)
    if (classes.length === 0) {
      const seen = {};
      for (let i = 0; i < lines.length; i++) {
        const line = lines[i];
        const tabParts = line.split('\t').map(p => p.trim()).filter(Boolean);

        if (tabParts.length >= 2) {
          let courseName = '';
          let teacher = '';
          let gradePercent = null;
          let gradeLetter = null;

          for (const part of tabParts) {
            const pctMatch = part.match(/(\d+\.?\d*)\s*%/);
            const letterMatch = part.match(/^([A-F][+-]?)$/);

            if (pctMatch && gradePercent === null) {
              gradePercent = parseFloat(pctMatch[1]);
            } else if (letterMatch && !gradeLetter) {
              gradeLetter = letterMatch[1];
            } else if (!courseName && part.length > 2 && !part.match(/^\d+$/) && !part.match(/^\d+\.?\d*$/)) {
              courseName = cleanCourseName(part);
            } else if (courseName && !teacher && part.match(/[A-Z][a-z]/) && !part.match(/^\d/)) {
              teacher = part;
            }
          }

          if (courseName && (gradePercent !== null || gradeLetter) && !seen[courseName.toLowerCase()]) {
            seen[courseName.toLowerCase()] = true;
            classes.push({
              className: courseName,
              period: '',
              teacher,
              room: '',
              courseLevel: store.detectCourseLevel(courseName),
              credits: 3,
              gradePercent,
              gradeLetter
            });
          }
        }
      }
    }

    return { studentName, classes };
  }

  // Toast Notification Helper
  function showToast(message, type = 'info') {
    if (!elements.toastContainer) return;
    const toast = document.createElement('div');
    toast.className = `toast ${type}`;
    toast.textContent = message;
    elements.toastContainer.appendChild(toast);
    setTimeout(() => {
      toast.style.opacity = '0';
      toast.style.transform = 'translateY(10px)';
      toast.style.transition = 'all 200ms ease';
      setTimeout(() => toast.remove(), 200);
    }, 2800);
  }

  function downloadFile(content, fileName, contentType) {
    const blob = new Blob([content], { type: contentType });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = fileName;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  function bindNavTargetClicks(parent) {
    parent.querySelectorAll('[data-nav-target]').forEach(link => {
      link.addEventListener('click', (e) => {
        e.preventDefault();
        const target = link.getAttribute('data-nav-target');
        navigateTo(target);
      });
    });
  }

  // Expose global AcademiaPro interface for native bridge and devtools
  window.AcademiaPro = {
    store,
    state,
    navigateTo,
    startPomodoro,
    pausePomodoro,
    resetPomodoro,
    selectPomodoroPreset,
    playCompletionChime,
    triggerHaptic,
    updateDailyStreak
  };

  // Execution Bootstrapper
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', initApp);
  } else {
    initApp();
  }

})();


  </script>
