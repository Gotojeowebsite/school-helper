<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AcademiaPro — Student Planner & Homework Tracker</title>
  <meta name="description" content="A comprehensive academic organizer for tracking homework assignments, exams, class timetables, weighted grades, and GPA." />
  
  <!-- Modern Inter & JetBrains Mono Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
  
  <!-- Design System CSS -->
  <!-- Inlined Design System CSS for Standalone / Google Sites Embed -->
  <style>
/* ==========================================================================
   ACADEMIA PRO - School Helper & Assignment Tracker Design System
   Modern, Clean, Responsive CSS Architecture with Light/Dark Themes
   ========================================================================== */

:root {
  /* Font Family */
  --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
  --font-mono: 'JetBrains Mono', 'Fira Code', Consolas, monospace;

  /* Theme Tokens - Light Mode Default */
  --bg-app: #f8fafc;
  --bg-surface: #ffffff;
  --bg-surface-hover: #f1f5f9;
  --bg-surface-active: #e2e8f0;
  --bg-surface-elevated: #ffffff;
  --bg-sidebar: #ffffff;
  
  --border-subtle: #f1f5f9;
  --border-default: #e2e8f0;
  --border-strong: #cbd5e1;
  
  --text-primary: #0f172a;
  --text-secondary: #475569;
  --text-muted: #94a3b8;
  --text-inverse: #ffffff;

  /* Accent Colors */
  --accent: #2563eb;
  --accent-light: #eff6ff;
  --accent-hover: #1d4ed8;
  --accent-focus: rgba(37, 99, 235, 0.2);

  /* Semantic Feedback */
  --success: #10b981;
  --success-light: #ecfdf5;
  --success-border: #a7f3d0;
  
  --warning: #f59e0b;
  --warning-light: #fffbeb;
  --warning-border: #fde68a;

  --danger: #ef4444;
  --danger-light: #fef2f2;
  --danger-border: #fecaca;

  --info: #06b6d4;
  --info-light: #ecfeff;
  --info-border: #a5f3fc;

  /* Elevation & Shadows */
  --shadow-xs: 0 1px 2px 0 rgba(15, 23, 42, 0.05);
  --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.08), 0 1px 2px -1px rgba(15, 23, 42, 0.08);
  --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.06);
  --shadow-lg: 0 10px 15px -3px rgba(15, 23, 42, 0.08), 0 4px 6px -4px rgba(15, 23, 42, 0.04);
  --shadow-xl: 0 20px 25px -5px rgba(15, 23, 42, 0.1), 0 8px 10px -6px rgba(15, 23, 42, 0.04);

  /* Border Radii */
  --radius-sm: 6px;
  --radius-md: 10px;
  --radius-lg: 14px;
  --radius-xl: 20px;
  --radius-full: 9999px;

  /* Layout Sizing */
  --sidebar-width: 260px;
  --header-height: 64px;
  --bottom-nav-height: 64px;
  
  /* Transitions */
  --transition-fast: 150ms cubic-bezier(0.4, 0, 0.2, 1);
  --transition-normal: 250ms cubic-bezier(0.4, 0, 0.2, 1);
}

/* Dark Theme Variables */
[data-theme="dark"] {
  --bg-app: #090d16;
  --bg-surface: #111827;
  --bg-surface-hover: #1f2937;
  --bg-surface-active: #374151;
  --bg-surface-elevated: #1e293b;
  --bg-sidebar: #0f172a;
  
  --border-subtle: #1e293b;
  --border-default: #334155;
  --border-strong: #475569;
  
  --text-primary: #f8fafc;
  --text-secondary: #cbd5e1;
  --text-muted: #64748b;
  --text-inverse: #0f172a;

  --accent: #3b82f6;
  --accent-light: rgba(59, 130, 246, 0.15);
  --accent-hover: #60a5fa;
  --accent-focus: rgba(59, 130, 246, 0.3);

  --success-light: rgba(16, 185, 129, 0.15);
  --success-border: rgba(16, 185, 129, 0.3);
  
  --warning-light: rgba(245, 158, 11, 0.15);
  --warning-border: rgba(245, 158, 11, 0.3);

  --danger-light: rgba(239, 68, 68, 0.15);
  --danger-border: rgba(239, 68, 68, 0.3);

  --info-light: rgba(6, 182, 212, 0.15);
  --info-border: rgba(6, 182, 212, 0.3);

  --shadow-xs: 0 1px 2px 0 rgba(0, 0, 0, 0.4);
  --shadow-sm: 0 1px 3px 0 rgba(0, 0, 0, 0.5);
  --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.5);
  --shadow-lg: 0 10px 15px -3px rgba(0, 0, 0, 0.6);
  --shadow-xl: 0 20px 25px -5px rgba(0, 0, 0, 0.7);
}

/* ==========================================================================
   Base Styles & Reset
   ========================================================================== */

*, *::before, *::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  font-size: 16px;
  line-height: 1.5;
  -webkit-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: var(--font-sans);
  background-color: var(--bg-app);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  display: flex;
  transition: background-color var(--transition-normal), color var(--transition-normal);
}

input, button, select, textarea {
  font-family: inherit;
  font-size: inherit;
  color: inherit;
}

button {
  cursor: pointer;
  border: none;
  background: none;
  outline: none;
}

a {
  color: inherit;
  text-decoration: none;
}

/* Scrollbars */
::-webkit-scrollbar {
  width: 6px;
  height: 6px;
}
::-webkit-scrollbar-track {
  background: transparent;
}
::-webkit-scrollbar-thumb {
  background: var(--border-strong);
  border-radius: var(--radius-full);
}
::-webkit-scrollbar-thumb:hover {
  background: var(--text-muted);
}

/* ==========================================================================
   Layout Shell: Sidebar, Main Stage, Header, Mobile Nav
   ========================================================================== */

#app-container {
  display: flex;
  width: 100vw;
  min-height: 100vh;
  position: relative;
}

/* Sidebar */
.app-sidebar {
  width: var(--sidebar-width);
  background-color: var(--bg-sidebar);
  border-right: 1px solid var(--border-default);
  display: flex;
  flex-direction: column;
  height: 100vh;
  position: sticky;
  top: 0;
  z-index: 40;
  transition: transform var(--transition-normal);
}

.sidebar-header {
  height: var(--header-height);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.25rem;
  border-bottom: 1px solid var(--border-subtle);
}

.brand-logo {
  display: flex;
  align-items: center;
  gap: 0.625rem;
  font-weight: 700;
  font-size: 1.125rem;
  letter-spacing: -0.025em;
  color: var(--text-primary);
}

.brand-icon {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  background: linear-gradient(135deg, var(--accent), #6366f1);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: var(--shadow-sm);
}

.semester-selector-wrapper {
  padding: 0.75rem 1.25rem;
  border-bottom: 1px solid var(--border-subtle);
}

.semester-select {
  width: 100%;
  padding: 0.5rem 0.75rem;
  background-color: var(--bg-surface-hover);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-secondary);
  outline: none;
  cursor: pointer;
  transition: border-color var(--transition-fast);
}
.semester-select:focus {
  border-color: var(--accent);
}

.sidebar-nav {
  flex: 1;
  padding: 1rem 0.75rem;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
}

.nav-section-title {
  font-size: 0.6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  padding: 0.75rem 0.75rem 0.375rem;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 0.75rem;
  padding: 0.625rem 0.75rem;
  border-radius: var(--radius-md);
  font-size: 0.875rem;
  font-weight: 500;
  color: var(--text-secondary);
  transition: all var(--transition-fast);
  position: relative;
}

.nav-item:hover {
  background-color: var(--bg-surface-hover);
  color: var(--text-primary);
}

.nav-item.active {
  background-color: var(--accent-light);
  color: var(--accent);
  font-weight: 600;
}

.nav-item-icon {
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}

.nav-badge {
  margin-left: auto;
  font-size: 0.75rem;
  padding: 0.125rem 0.5rem;
  border-radius: var(--radius-full);
  font-weight: 600;
  background-color: var(--bg-surface-hover);
  color: var(--text-secondary);
}

.nav-badge.danger {
  background-color: var(--danger-light);
  color: var(--danger);
}

.sidebar-footer {
  padding: 1rem 1.25rem;
  border-top: 1px solid var(--border-subtle);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.sidebar-user {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.user-avatar {
  width: 34px;
  height: 34px;
  border-radius: var(--radius-full);
  background: linear-gradient(135deg, #f59e0b, #ec4899);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 0.875rem;
}

.user-info {
  display: flex;
  flex-direction: column;
}

.user-name {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-primary);
}

.user-status {
  font-size: 0.6875rem;
  color: var(--text-muted);
}

/* Main Content Area */
.app-main {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  max-width: calc(100vw - var(--sidebar-width));
  overflow-x: hidden;
}

/* Top App Header */
.app-header {
  height: var(--header-height);
  background-color: var(--bg-surface);
  border-bottom: 1px solid var(--border-default);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 1.75rem;
  position: sticky;
  top: 0;
  z-index: 30;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 1rem;
  flex: 1;
  max-width: 480px;
}

.mobile-menu-toggle {
  display: none;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-md);
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
}
.mobile-menu-toggle:hover {
  background-color: var(--bg-surface-hover);
  color: var(--text-primary);
}

.global-search-wrapper {
  position: relative;
  width: 100%;
}

.search-icon {
  position: absolute;
  left: 0.875rem;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  pointer-events: none;
}

.global-search-input {
  width: 100%;
  padding: 0.5rem 0.875rem 0.5rem 2.375rem;
  background-color: var(--bg-surface-hover);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  font-size: 0.875rem;
  color: var(--text-primary);
  outline: none;
  transition: all var(--transition-fast);
}

.global-search-input:focus {
  background-color: var(--bg-surface);
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-focus);
}

.search-shortcut-badge {
  position: absolute;
  right: 0.75rem;
  top: 50%;
  transform: translateY(-50%);
  font-size: 0.6875rem;
  font-family: var(--font-mono);
  background: var(--bg-surface);
  border: 1px solid var(--border-strong);
  padding: 0.125rem 0.375rem;
  border-radius: 4px;
  color: var(--text-muted);
  pointer-events: none;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.icon-btn {
  width: 38px;
  height: 38px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  background-color: var(--bg-surface);
  border: 1px solid var(--border-default);
  transition: all var(--transition-fast);
  position: relative;
}

.icon-btn:hover {
  background-color: var(--bg-surface-hover);
  color: var(--text-primary);
  border-color: var(--border-strong);
}

.notification-dot {
  position: absolute;
  top: 8px;
  right: 8px;
  width: 8px;
  height: 8px;
  border-radius: var(--radius-full);
  background-color: var(--danger);
  border: 2px solid var(--bg-surface);
}

.btn-primary {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5625rem 1.125rem;
  background-color: var(--accent);
  color: white;
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 0.875rem;
  box-shadow: var(--shadow-sm);
  transition: all var(--transition-fast);
}

.btn-primary:hover {
  background-color: var(--accent-hover);
  box-shadow: var(--shadow-md);
  transform: translateY(-1px);
}

.btn-secondary {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.5625rem 1rem;
  background-color: var(--bg-surface);
  color: var(--text-primary);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  font-weight: 600;
  font-size: 0.875rem;
  transition: all var(--transition-fast);
}

.btn-secondary:hover {
  background-color: var(--bg-surface-hover);
  border-color: var(--border-strong);
}

/* Main Viewport */
.app-viewport {
  flex: 1;
  padding: 1.75rem;
  max-width: 1440px;
  width: 100%;
  margin: 0 auto;
}

/* Mobile Bottom Navigation */
.mobile-bottom-nav {
  display: none;
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  height: var(--bottom-nav-height);
  background-color: var(--bg-surface);
  border-top: 1px solid var(--border-default);
  z-index: 40;
  justify-content: space-around;
  align-items: center;
  padding: 0 0.5rem;
}

.mobile-nav-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 0.25rem;
  color: var(--text-muted);
  font-size: 0.6875rem;
  font-weight: 600;
  flex: 1;
  padding: 0.375rem 0;
  transition: color var(--transition-fast);
}

.mobile-nav-btn.active {
  color: var(--accent);
}

/* ==========================================================================
   Component System: Cards, Badges, Modals, Forms, Stats
   ========================================================================== */

.view-section {
  display: none;
  animation: fadeIn 200ms ease;
}

.view-section.active {
  display: block;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(6px); }
  to { opacity: 1; transform: translateY(0); }
}

.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.5rem;
  flex-wrap: wrap;
  gap: 1rem;
}

.section-title {
  font-size: 1.5rem;
  font-weight: 700;
  letter-spacing: -0.025em;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

.section-subtitle {
  font-size: 0.875rem;
  color: var(--text-secondary);
  margin-top: 0.25rem;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}

/* Stat Cards Grid */
.stat-cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
  gap: 1rem;
  margin-bottom: 1.75rem;
}

.stat-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  display: flex;
  align-items: center;
  gap: 1rem;
  box-shadow: var(--shadow-xs);
  transition: transform var(--transition-fast), box-shadow var(--transition-fast);
}

.stat-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
}

.stat-icon-wrapper {
  width: 48px;
  height: 48px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 1.25rem;
}

.stat-icon-wrapper.blue { background: rgba(37, 99, 235, 0.12); color: #2563eb; }
.stat-icon-wrapper.emerald { background: rgba(16, 185, 129, 0.12); color: #10b981; }
.stat-icon-wrapper.amber { background: rgba(245, 158, 11, 0.12); color: #f59e0b; }
.stat-icon-wrapper.purple { background: rgba(139, 92, 246, 0.12); color: #8b5cf6; }
.stat-icon-wrapper.rose { background: rgba(244, 63, 94, 0.12); color: #f43f5e; }

.stat-content {
  display: flex;
  flex-direction: column;
}

.stat-label {
  font-size: 0.75rem;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
}

.stat-value {
  font-size: 1.5rem;
  font-weight: 700;
  color: var(--text-primary);
  line-height: 1.2;
  margin-top: 0.125rem;
}

.stat-subtext {
  font-size: 0.75rem;
  color: var(--text-secondary);
  margin-top: 0.25rem;
}

/* Dashboard Two-Column Grid */
.dashboard-grid {
  display: grid;
  grid-template-columns: 1fr 360px;
  gap: 1.5rem;
}

.card-panel {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  box-shadow: var(--shadow-xs);
  margin-bottom: 1.5rem;
}

.panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1.25rem;
}

.panel-title {
  font-size: 1.125rem;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.panel-action-link {
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--accent);
}
.panel-action-link:hover {
  text-decoration: underline;
}

/* Pills and Badges */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.25rem 0.625rem;
  border-radius: var(--radius-full);
  font-size: 0.75rem;
  font-weight: 600;
  line-height: 1;
}

.badge-dot {
  width: 6px;
  height: 6px;
  border-radius: var(--radius-full);
}

.badge.primary { background: var(--accent-light); color: var(--accent); }
.badge.success { background: var(--success-light); color: var(--success); }
.badge.warning { background: var(--warning-light); color: var(--warning); }
.badge.danger { background: var(--danger-light); color: var(--danger); }
.badge.info { background: var(--info-light); color: var(--info); }
.badge.neutral { background: var(--bg-surface-hover); color: var(--text-secondary); }

/* Task / Assignment Item Row */
.task-item {
  display: flex;
  align-items: flex-start;
  gap: 0.875rem;
  padding: 1rem;
  border: 1px solid var(--border-subtle);
  background-color: var(--bg-surface);
  border-radius: var(--radius-md);
  margin-bottom: 0.75rem;
  transition: all var(--transition-fast);
  position: relative;
}

.task-item:hover {
  border-color: var(--border-strong);
  box-shadow: var(--shadow-sm);
}

.task-item.completed {
  opacity: 0.65;
  background-color: var(--bg-surface-hover);
}

.task-item.completed .task-title {
  text-decoration: line-through;
  color: var(--text-muted);
}

.task-item.overdue {
  border-left: 4px solid var(--danger);
}

.task-checkbox {
  appearance: none;
  -webkit-appearance: none;
  width: 20px;
  height: 20px;
  border: 2px solid var(--border-strong);
  border-radius: 6px;
  margin-top: 2px;
  cursor: pointer;
  display: grid;
  place-content: center;
  transition: all var(--transition-fast);
  flex-shrink: 0;
}

.task-checkbox:checked {
  background-color: var(--success);
  border-color: var(--success);
}

.task-checkbox:checked::before {
  content: "";
  width: 10px;
  height: 6px;
  border-left: 2px solid white;
  border-bottom: 2px solid white;
  transform: rotate(-45deg) translate(1px, -1px);
}

.task-details {
  flex: 1;
  min-width: 0;
}

.task-top-row {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-bottom: 0.25rem;
}

.class-tag {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
  padding: 0.1875rem 0.5rem;
  border-radius: var(--radius-sm);
  font-size: 0.6875rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.025em;
}

.task-title {
  font-size: 0.9375rem;
  font-weight: 600;
  color: var(--text-primary);
  word-break: break-word;
}

.task-description {
  font-size: 0.8125rem;
  color: var(--text-secondary);
  margin-top: 0.25rem;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
}

.task-meta-row {
  display: flex;
  align-items: center;
  gap: 1rem;
  margin-top: 0.625rem;
  flex-wrap: wrap;
  font-size: 0.75rem;
  color: var(--text-secondary);
}

.meta-item {
  display: inline-flex;
  align-items: center;
  gap: 0.375rem;
}

.meta-item.overdue {
  color: var(--danger);
  font-weight: 600;
}

.task-actions {
  display: flex;
  align-items: center;
  gap: 0.25rem;
  opacity: 0.6;
  transition: opacity var(--transition-fast);
}

.task-item:hover .task-actions {
  opacity: 1;
}

.subtasks-progress-wrapper {
  margin-top: 0.625rem;
  width: 100%;
}

.progress-bar-container {
  height: 5px;
  background-color: var(--border-default);
  border-radius: var(--radius-full);
  overflow: hidden;
  margin-top: 0.25rem;
}

.progress-bar-fill {
  height: 100%;
  background-color: var(--accent);
  border-radius: var(--radius-full);
  transition: width var(--transition-normal);
}

/* Filter Controls Bar */
.filters-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 0.75rem;
  background-color: var(--bg-surface);
  border: 1px solid var(--border-default);
  padding: 0.75rem 1rem;
  border-radius: var(--radius-lg);
  margin-bottom: 1.25rem;
}

.filter-group {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  flex-wrap: wrap;
}

.filter-pill {
  padding: 0.375rem 0.875rem;
  border-radius: var(--radius-full);
  font-size: 0.8125rem;
  font-weight: 600;
  background-color: var(--bg-surface-hover);
  color: var(--text-secondary);
  border: 1px solid var(--border-subtle);
  transition: all var(--transition-fast);
}

.filter-pill:hover {
  color: var(--text-primary);
  border-color: var(--border-default);
}

.filter-pill.active {
  background-color: var(--accent);
  color: white;
  border-color: var(--accent);
}

.select-filter {
  padding: 0.375rem 0.75rem;
  background-color: var(--bg-surface-hover);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  font-size: 0.8125rem;
  font-weight: 500;
  color: var(--text-primary);
  outline: none;
}

/* Exam Card Component */
.exam-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  padding: 1.25rem;
  margin-bottom: 1rem;
  box-shadow: var(--shadow-xs);
  transition: all var(--transition-fast);
  border-left: 5px solid var(--accent);
}

.exam-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-sm);
}

.exam-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 1rem;
}

.exam-title {
  font-size: 1.0625rem;
  font-weight: 700;
  color: var(--text-primary);
}

.countdown-badge {
  background: linear-gradient(135deg, #f59e0b, #ef4444);
  color: white;
  font-weight: 700;
  font-size: 0.75rem;
  padding: 0.25rem 0.625rem;
  border-radius: var(--radius-full);
  box-shadow: var(--shadow-xs);
  white-space: nowrap;
}

.exam-grid-info {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
  gap: 0.75rem;
  margin-top: 1rem;
  padding-top: 0.875rem;
  border-top: 1px solid var(--border-subtle);
  font-size: 0.8125rem;
}

.exam-info-block {
  display: flex;
  flex-direction: column;
}

.info-label {
  font-size: 0.6875rem;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  font-weight: 600;
}

.info-value {
  font-weight: 600;
  color: var(--text-primary);
  margin-top: 0.125rem;
}

/* Calendar Month / Week View */
.calendar-container {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  overflow: hidden;
  box-shadow: var(--shadow-xs);
}

.calendar-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border-default);
}

.calendar-month-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-primary);
}

.calendar-nav-buttons {
  display: flex;
  align-items: center;
  gap: 0.5rem;
}

.calendar-grid-days-header {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  background-color: var(--bg-surface-hover);
  border-bottom: 1px solid var(--border-default);
  text-align: center;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  color: var(--text-muted);
  padding: 0.625rem 0;
}

.calendar-grid-month {
  display: grid;
  grid-template-columns: repeat(7, 1fr);
  grid-auto-rows: minmax(110px, 1fr);
}

.calendar-day-cell {
  border-right: 1px solid var(--border-subtle);
  border-bottom: 1px solid var(--border-subtle);
  padding: 0.5rem;
  position: relative;
  background-color: var(--bg-surface);
  transition: background-color var(--transition-fast);
  display: flex;
  flex-direction: column;
  min-height: 110px;
}

.calendar-day-cell:nth-child(7n) {
  border-right: none;
}

.calendar-day-cell.other-month {
  background-color: var(--bg-surface-hover);
  opacity: 0.5;
}

.calendar-day-cell.today {
  background-color: var(--accent-light);
}

.day-number {
  font-size: 0.8125rem;
  font-weight: 600;
  width: 24px;
  height: 24px;
  border-radius: var(--radius-full);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-primary);
  margin-bottom: 0.25rem;
}

.calendar-day-cell.today .day-number {
  background-color: var(--accent);
  color: white;
}

.calendar-events-list {
  display: flex;
  flex-direction: column;
  gap: 0.25rem;
  overflow-y: auto;
  max-height: 80px;
}

.cal-event-pill {
  font-size: 0.6875rem;
  font-weight: 600;
  padding: 0.1875rem 0.375rem;
  border-radius: 4px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  cursor: pointer;
  display: flex;
  align-items: center;
  gap: 0.25rem;
}

/* Timetable / Schedule Grid */
.timetable-wrapper {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  overflow-x: auto;
  box-shadow: var(--shadow-xs);
}

.timetable-grid {
  display: grid;
  grid-template-columns: 80px repeat(5, minmax(160px, 1fr));
  min-width: 800px;
}

.time-column-header, .day-column-header {
  background-color: var(--bg-surface-hover);
  padding: 0.875rem;
  font-size: 0.8125rem;
  font-weight: 700;
  text-align: center;
  color: var(--text-secondary);
  border-bottom: 1px solid var(--border-default);
  border-right: 1px solid var(--border-default);
}

.time-slot-label {
  padding: 0.75rem 0.5rem;
  font-size: 0.75rem;
  font-family: var(--font-mono);
  color: var(--text-muted);
  text-align: center;
  border-bottom: 1px solid var(--border-subtle);
  border-right: 1px solid var(--border-default);
}

.timetable-slot-cell {
  border-bottom: 1px solid var(--border-subtle);
  border-right: 1px solid var(--border-subtle);
  padding: 0.375rem;
  min-height: 70px;
  background-color: var(--bg-surface);
}

.class-block-card {
  height: 100%;
  border-radius: var(--radius-md);
  padding: 0.5rem;
  color: white;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  box-shadow: var(--shadow-xs);
  font-size: 0.75rem;
}

.class-block-title {
  font-weight: 700;
  line-height: 1.2;
}

.class-block-meta {
  opacity: 0.9;
  font-size: 0.6875rem;
}

/* Grades & "What-If" Calculator */
.grades-container {
  display: grid;
  grid-template-columns: 1fr 380px;
  gap: 1.5rem;
}

.grade-class-card {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  margin-bottom: 1.25rem;
  box-shadow: var(--shadow-xs);
}

.grade-card-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
}

.grade-score-display {
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: -0.025em;
}

.grade-categories-table {
  width: 100%;
  border-collapse: collapse;
  margin-top: 0.75rem;
  font-size: 0.8125rem;
}

.grade-categories-table th {
  text-align: left;
  padding: 0.5rem 0;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-default);
}

.grade-categories-table td {
  padding: 0.5rem 0;
  border-bottom: 1px solid var(--border-subtle);
}

.what-if-panel {
  background: linear-gradient(135deg, var(--bg-surface), var(--bg-surface-hover));
  border: 1px solid var(--border-strong);
  border-radius: var(--radius-lg);
  padding: 1.5rem;
  box-shadow: var(--shadow-md);
  position: sticky;
  top: calc(var(--header-height) + 1.5rem);
}

.what-if-formula-box {
  background-color: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: 1rem;
  margin-top: 1rem;
}

/* Modals */
.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background-color: rgba(15, 23, 42, 0.6);
  backdrop-filter: blur(4px);
  z-index: 100;
  display: none;
  align-items: center;
  justify-content: center;
  padding: 1rem;
  animation: modalFadeIn 200ms ease;
}

.modal-overlay.active {
  display: flex;
}

@keyframes modalFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.modal-dialog {
  background-color: var(--bg-surface-elevated);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-xl);
  max-width: 600px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  box-shadow: var(--shadow-xl);
  display: flex;
  flex-direction: column;
}

.modal-header {
  padding: 1.25rem 1.5rem;
  border-bottom: 1px solid var(--border-default);
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.modal-title {
  font-size: 1.25rem;
  font-weight: 700;
  color: var(--text-primary);
}

.modal-close-btn {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-md);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
}
.modal-close-btn:hover {
  background-color: var(--bg-surface-hover);
  color: var(--text-primary);
}

.modal-body {
  padding: 1.5rem;
  flex: 1;
}

.modal-footer {
  padding: 1rem 1.5rem;
  border-top: 1px solid var(--border-default);
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 0.75rem;
}

/* Form Controls */
.form-group {
  margin-bottom: 1.125rem;
}

.form-row {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1rem;
}

.form-label {
  display: block;
  font-size: 0.8125rem;
  font-weight: 600;
  color: var(--text-primary);
  margin-bottom: 0.375rem;
}

.form-control {
  width: 100%;
  padding: 0.625rem 0.875rem;
  background-color: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  font-size: 0.875rem;
  color: var(--text-primary);
  outline: none;
  transition: border-color var(--transition-fast), box-shadow var(--transition-fast);
}

.form-control:focus {
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-focus);
}

textarea.form-control {
  min-height: 80px;
  resize: vertical;
}

/* Color Swatches Picker */
.color-picker-grid {
  display: flex;
  gap: 0.5rem;
  flex-wrap: wrap;
  margin-top: 0.375rem;
}

.color-swatch {
  width: 32px;
  height: 32px;
  border-radius: var(--radius-full);
  cursor: pointer;
  border: 2px solid transparent;
  transition: transform var(--transition-fast);
  display: flex;
  align-items: center;
  justify-content: center;
}

.color-swatch:hover {
  transform: scale(1.15);
}

.color-swatch.active {
  border-color: var(--text-primary);
  box-shadow: 0 0 0 2px var(--bg-surface);
}

/* Toast Notifications */
.toast-container {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 120;
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  pointer-events: none;
}

.toast {
  background-color: var(--bg-surface-elevated);
  border: 1px solid var(--border-default);
  color: var(--text-primary);
  padding: 0.875rem 1.25rem;
  border-radius: var(--radius-md);
  box-shadow: var(--shadow-lg);
  display: flex;
  align-items: center;
  gap: 0.75rem;
  font-size: 0.875rem;
  font-weight: 500;
  pointer-events: auto;
  animation: slideToast 250ms cubic-bezier(0.4, 0, 0.2, 1);
  min-width: 280px;
}

@keyframes slideToast {
  from { transform: translateX(100%); opacity: 0; }
  to { transform: translateX(0); opacity: 1; }
}

/* ==========================================================================
   Responsive Breakpoints
   ========================================================================== */

@media (max-width: 1024px) {
  .dashboard-grid {
    grid-template-columns: 1fr;
  }
  .grades-container {
    grid-template-columns: 1fr;
  }
  .what-if-panel {
    position: static;
  }
}

@media (max-width: 768px) {
  :root {
    --sidebar-width: 0px;
  }

  .app-sidebar {
    position: fixed;
    left: -280px;
    width: 280px;
    transition: transform var(--transition-normal);
  }

  .app-sidebar.mobile-open {
    transform: translateX(280px);
  }

  .mobile-menu-toggle {
    display: flex;
  }

  .app-main {
    max-width: 100vw;
    padding-bottom: calc(var(--bottom-nav-height) + 1.5rem);
  }

  .mobile-bottom-nav {
    display: flex;
  }

  .app-viewport {
    padding: 1rem;
  }

  .form-row {
    grid-template-columns: 1fr;
  }

  .stat-cards-grid {
    grid-template-columns: 1fr 1fr;
  }
}

@media (max-width: 480px) {
  .stat-cards-grid {
    grid-template-columns: 1fr;
  }
  .calendar-day-cell {
    min-height: 70px;
    padding: 0.25rem;
  }
  .cal-event-pill span {
    display: none;
  }
}

/* ==========================================================================
   Cloud Sync & Authentication Components
   ========================================================================== */

.cloud-status-dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  border-radius: var(--radius-full);
  margin-right: 4px;
  vertical-align: middle;
}

.cloud-status-dot.synced {
  background-color: var(--success);
  box-shadow: 0 0 6px var(--success);
}

.cloud-status-dot.syncing {
  background-color: var(--accent);
  animation: pulseSync 1s infinite alternate;
}

.cloud-status-dot.offline {
  background-color: var(--text-muted);
}

@keyframes pulseSync {
  from { opacity: 0.4; transform: scale(0.85); }
  to { opacity: 1; transform: scale(1.15); }
}

.auth-tabs-header {
  display: flex;
  border-bottom: 1px solid var(--border-default);
  margin-bottom: 1.25rem;
}

.auth-tab-btn {
  flex: 1;
  padding: 0.75rem 1rem;
  font-weight: 600;
  font-size: 0.875rem;
  text-align: center;
  color: var(--text-secondary);
  border-bottom: 2px solid transparent;
  transition: all var(--transition-fast);
}

.auth-tab-btn.active {
  color: var(--accent);
  border-bottom-color: var(--accent);
}

.auth-alert-box {
  padding: 0.75rem 1rem;
  border-radius: var(--radius-md);
  font-size: 0.8125rem;
  margin-bottom: 1rem;
  display: none;
}

.auth-alert-box.danger {
  background-color: var(--danger-light);
  border: 1px solid var(--danger-border);
  color: var(--danger);
  display: block;
}

.auth-alert-box.success {
  background-color: var(--success-light);
  border: 1px solid var(--success-border);
  color: var(--success);
  display: block;
}

.firebase-config-box {
  background: var(--bg-surface-hover);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  padding: 1rem;
  font-family: var(--font-mono);
  font-size: 0.75rem;
  overflow-x: auto;
}

.cloud-status-dot.saved {
  background-color: var(--accent);
  box-shadow: 0 0 6px rgba(37, 99, 235, 0.4);
}

/* ==========================================================================
   Welcome / Login Screen
   ========================================================================== */

.welcome-screen {
  position: fixed;
  inset: 0;
  z-index: 9999;
  background-color: var(--bg-app);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 1.5rem;
  overflow-y: auto;
  animation: welcomeFadeIn 400ms ease;
}

@keyframes welcomeFadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

.welcome-container {
  width: 100%;
  max-width: 440px;
  display: flex;
  flex-direction: column;
  gap: 2rem;
}

.welcome-brand {
  text-align: center;
}

.welcome-brand-icon {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  background: linear-gradient(135deg, var(--accent), #6366f1);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 1rem;
  box-shadow: 0 8px 24px rgba(37, 99, 235, 0.25);
}

.welcome-title {
  font-size: 1.75rem;
  font-weight: 800;
  letter-spacing: -0.035em;
  color: var(--text-primary);
  margin-bottom: 0.375rem;
}

.welcome-tagline {
  font-size: 0.9375rem;
  color: var(--text-secondary);
  line-height: 1.4;
}

.welcome-section {
  background: var(--bg-surface);
  border: 1px solid var(--border-default);
  border-radius: var(--radius-lg);
  padding: 1.75rem;
  box-shadow: var(--shadow-md);
  animation: welcomeSlideUp 350ms ease;
}

.welcome-section.hidden {
  display: none;
}

@keyframes welcomeSlideUp {
  from { opacity: 0; transform: translateY(12px); }
  to { opacity: 1; transform: translateY(0); }
}

.welcome-section-title {
  font-size: 1.1875rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: var(--text-primary);
  margin-bottom: 0.25rem;
}

.welcome-section-desc {
  font-size: 0.8125rem;
  color: var(--text-secondary);
  margin-bottom: 1.25rem;
}

.welcome-accounts-list {
  display: flex;
  flex-direction: column;
  gap: 0.5rem;
  margin-bottom: 1rem;
}

.welcome-account-card {
  display: flex;
  align-items: center;
  gap: 0.875rem;
  padding: 0.875rem 1rem;
  border: 1px solid var(--border-default);
  border-radius: var(--radius-md);
  background: var(--bg-surface);
  cursor: pointer;
  transition: all 150ms ease;
  width: 100%;
  text-align: left;
}

.welcome-account-card:hover {
  background: var(--bg-surface-hover);
  border-color: var(--accent);
  box-shadow: 0 0 0 3px var(--accent-focus);
  transform: translateY(-1px);
}

.welcome-account-avatar {
  width: 40px;
  height: 40px;
  border-radius: 12px;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 0.875rem;
  flex-shrink: 0;
}

.welcome-account-info {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
}

.welcome-account-name {
  font-weight: 600;
  font-size: 0.9375rem;
  color: var(--text-primary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.welcome-account-school {
  font-size: 0.75rem;
  color: var(--text-muted);
  margin-top: 0.125rem;
}

.welcome-link-btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.875rem;
  font-weight: 600;
  color: var(--accent);
  padding: 0.5rem 0;
  transition: color 150ms;
  cursor: pointer;
  background: none;
  border: none;
  width: 100%;
  justify-content: center;
}

.welcome-link-btn:hover {
  color: var(--accent-hover);
}

.welcome-form {
  display: flex;
  flex-direction: column;
  gap: 1rem;
}

.welcome-avatar-preview-row {
  display: flex;
  align-items: center;
  gap: 1.25rem;
}

.welcome-avatar-preview {
  width: 56px;
  height: 56px;
  border-radius: 16px;
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 700;
  font-size: 1.25rem;
  flex-shrink: 0;
  transition: background 200ms ease;
  box-shadow: var(--shadow-sm);
}

.avatar-color-picker {
  flex: 1;
}

.avatar-color-label {
  display: block;
  font-size: 0.75rem;
  font-weight: 600;

/**
 * AcademiaPro — Complete Academic Organizer Application with Cloud Sync
 * Single bundle containing data store, calculations engine, Firebase Auth & Cloud Firestore sync,
 * and view controllers. 100% functional both offline and cloud-connected.
 */

(function() {
  'use strict';

  const ACCOUNTS_REGISTRY_KEY = 'academia_pro_accounts_v1';
  const ACTIVE_ACCOUNT_KEY = 'academia_pro_active_account_v1';
  const FIREBASE_CONFIG_KEY = 'academia_firebase_config_v1';

  // --- LOCAL ACCOUNT MANAGER ---
  class LocalAccountManager {
    constructor() {
      this.accounts = this.loadAccounts();
      this.activeAccountId = this.loadActiveAccountId();
    }

    loadAccounts() {
      try {
        const raw = localStorage.getItem(ACCOUNTS_REGISTRY_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (e) {
        return [];
      }
    }

    saveAccounts() {
      localStorage.setItem(ACCOUNTS_REGISTRY_KEY, JSON.stringify(this.accounts));
    }

    loadActiveAccountId() {
      return localStorage.getItem(ACTIVE_ACCOUNT_KEY) || null;
    }

    saveActiveAccountId(id) {
      this.activeAccountId = id;
      if (id) {
        localStorage.setItem(ACTIVE_ACCOUNT_KEY, id);
      } else {
        localStorage.removeItem(ACTIVE_ACCOUNT_KEY);
      }
    }

    getStorageKeyForAccount(accountId) {
      return `academia_pro_data_${accountId}`;
    }

    getActiveAccount() {
      if (!this.activeAccountId) return null;
      return this.accounts.find(a => a.id === this.activeAccountId) || null;
    }

    getActiveStorageKey() {
      if (!this.activeAccountId) return null;
      return this.getStorageKeyForAccount(this.activeAccountId);
    }

    isLoggedIn() {
      return !!this.activeAccountId && !!this.getActiveAccount();
    }

    createAccount(name, schoolName, avatarColor) {
      const id = 'acct-' + Date.now() + '-' + Math.random().toString(36).slice(2, 8);
      const initials = name.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2) || 'ST';
      const account = {
        id,
        name: name.trim(),
        schoolName: schoolName.trim() || '',
        initials,
        avatarColor: avatarColor || this._pickAvatarColor(),
        createdAt: new Date().toISOString()
      };
      this.accounts.push(account);
      this.saveAccounts();
      this.saveActiveAccountId(id);
      return account;
    }

    switchAccount(accountId) {
      const account = this.accounts.find(a => a.id === accountId);
      if (account) {
        this.saveActiveAccountId(accountId);
        return account;
      }
      return null;
    }

    updateAccount(accountId, updates) {
      const idx = this.accounts.findIndex(a => a.id === accountId);
      if (idx !== -1) {
        if (updates.name) {
          this.accounts[idx].name = updates.name;
          this.accounts[idx].initials = updates.name.trim().split(/\s+/).map(w => w[0]).join('').toUpperCase().slice(0, 2) || 'ST';
        }
        if (updates.schoolName !== undefined) this.accounts[idx].schoolName = updates.schoolName;
        if (updates.avatarColor) this.accounts[idx].avatarColor = updates.avatarColor;
        this.saveAccounts();
        return this.accounts[idx];
      }
      return null;
    }

    deleteAccount(accountId) {
      this.accounts = this.accounts.filter(a => a.id !== accountId);
      this.saveAccounts();
      // Remove that account's data
      try {
        localStorage.removeItem(this.getStorageKeyForAccount(accountId));
      } catch (e) { /* ignore */ }
      // If deleting the active account, clear it
      if (this.activeAccountId === accountId) {
        this.saveActiveAccountId(null);
      }
    }

    logout() {
      this.saveActiveAccountId(null);
    }

    _pickAvatarColor() {
      const colors = [
        'linear-gradient(135deg, #f59e0b, #ec4899)',
        'linear-gradient(135deg, #3b82f6, #8b5cf6)',
        'linear-gradient(135deg, #10b981, #06b6d4)',
        'linear-gradient(135deg, #ef4444, #f97316)',
        'linear-gradient(135deg, #6366f1, #ec4899)',
        'linear-gradient(135deg, #14b8a6, #3b82f6)',
        'linear-gradient(135deg, #8b5cf6, #f43f5e)',
        'linear-gradient(135deg, #f97316, #eab308)'
      ];
      return colors[Math.floor(Math.random() * colors.length)];
    }

    // Migrate legacy data: if there's data under the old key and no accounts exist
    migrateLegacyData(newAccountId) {
      const legacyKey = 'academia_pro_data_v1';
      try {
        const legacyData = localStorage.getItem(legacyKey);
        if (legacyData) {
          localStorage.setItem(this.getStorageKeyForAccount(newAccountId), legacyData);
          localStorage.removeItem(legacyKey);
          return true;
        }
      } catch (e) { /* ignore */ }
      return false;
    }
  }

  const accountManager = new LocalAccountManager();

  // Available Subject Color Palettes
  const SUBJECT_COLORS = [
    '#3b82f6', // Blue
    '#10b981', // Emerald
    '#8b5cf6', // Purple
    '#f59e0b', // Amber
    '#ef4444', // Red
    '#06b6d4', // Cyan
    '#ec4899', // Pink
    '#14b8a6', // Teal
    '#f97316', // Orange
    '#6366f1', // Indigo
  ];

  // Helper: Generate Relative Date ISO String
  function getRelativeDate(daysOffset, timeString = '23:59') {
    const date = new Date();
    date.setDate(date.getDate() + daysOffset);
    const year = date.getFullYear();
    const month = String(date.getMonth() + 1).padStart(2, '0');
    const day = String(date.getDate()).padStart(2, '0');
    
    if (!timeString) return `${year}-${month}-${day}`;
    return `${year}-${month}-${day}T${timeString}:00`;
  }

  // Default Initial Seed Data
  const DEFAULT_DATA = {
    settings: {
      activeSemesterId: 'sem-fall-2026',
      theme: 'light',

        id: 'sem-spring-2027',
        name: 'Spring 2027',
        startDate: '2027-01-10',
        endDate: '2027-05-28',
        isActive: false,
      }
    ],
    classes: [
      {
        id: 'cls-calc',
        semesterId: 'sem-fall-2026',
        name: 'AP Calculus BC',
        code: 'MATH 302',
        teacher: 'Dr. Aris Thorne',
        teacherEmail: 'a.thorne@westwood.edu',
        room: 'Science Bldg 304',
        color: '#3b82f6',

  // --- FIREBASE CLOUD SYNC MANAGER ---
  class FirebaseSyncManager {
    constructor() {
      this.isConfigured = false;
      this.currentUser = null;
      this.db = null;
      this.auth = null;
      this.syncDebounceTimer = null;
      this.statusListeners = new Set();
      this.init();
    }

    init() {
      if (typeof window === 'undefined' || typeof window.firebase === 'undefined') {
        console.info('Firebase SDK not loaded. Running in local storage mode.');
        return;
      }

      const savedConfig = this.getSavedConfig();
      if (!savedConfig || !savedConfig.apiKey) {
        console.info('No custom Firebase configuration provided. Running in local offline mode.');
        return;
      }

      try {
        if (!window.firebase.apps || !window.firebase.apps.length) {
          window.firebase.initializeApp(savedConfig);
        }
        this.auth = window.firebase.auth();
        this.db = window.firebase.firestore();
        this.isConfigured = true;

        this.auth.onAuthStateChanged(user => {
          this.currentUser = user;
          this.notifyStatusChange();
          if (user) {
            this.fetchFromCloudAndMerge();
            this.listenToCloudChanges();
          }
        });
      } catch (err) {
        console.error('Firebase initialization error:', err);
      }
    }

    getSavedConfig() {
      try {
        const raw = localStorage.getItem(FIREBASE_CONFIG_KEY);
        return raw ? JSON.parse(raw) : null;
      } catch (e) {
        return null;
      }
    }

    saveConfig(config) {
      try {
        localStorage.setItem(FIREBASE_CONFIG_KEY, JSON.stringify(config));
        this.init();
        return true;
      } catch (e) {
        return false;
      }
    }

    onStatusChange(fn) {
      this.statusListeners.add(fn);
      fn(this.getStatus());
      return () => this.statusListeners.delete(fn);
    }

    notifyStatusChange() {
      const status = this.getStatus();
      this.statusListeners.forEach(fn => fn(status));
    }

    getStatus() {
      return {
        isConfigured: this.isConfigured,
        isAuthenticated: !!this.currentUser,
        user: this.currentUser ? {
          email: this.currentUser.email,
          uid: this.currentUser.uid,
          displayName: this.currentUser.displayName
        } : null
      };
    }

    async signUp(email, password, displayName) {
      if (!this.auth) throw new Error('Please configure Firebase in Settings first.');
      const cred = await this.auth.createUserWithEmailAndPassword(email, password);
      if (displayName && cred.user) {
        await cred.user.updateProfile({ displayName });
      }
      return cred.user;
    }

    async signIn(email, password) {
      if (!this.auth) throw new Error('Please configure Firebase in Settings first.');
      const cred = await this.auth.signInWithEmailAndPassword(email, password);
      return cred.user;
    }

    async signOut() {
      if (this.auth) {
        await this.auth.signOut();
      }
    }

    // Debounced Cloud Sync from local store to Firestore
    syncToCloud(data) {
      if (!this.db || !this.currentUser) return;
      
      clearTimeout(this.syncDebounceTimer);
      this.syncDebounceTimer = setTimeout(async () => {
        try {
          updateCloudStatusDot('syncing');
          await this.db.collection('users').doc(this.currentUser.uid).set({
            planner: data,
            lastSyncedAt: new Date().toISOString()
          }, { merge: true });
          updateCloudStatusDot('synced');
        } catch (e) {
          console.error('Cloud sync error:', e);
          updateCloudStatusDot('offline');
        }
      }, 800);
    }

    async fetchFromCloudAndMerge() {
      if (!this.db || !this.currentUser) return;
      try {
        updateCloudStatusDot('syncing');
        const doc = await this.db.collection('users').doc(this.currentUser.uid).get();
        if (doc.exists && doc.data() && doc.data().planner) {
          const cloudData = doc.data().planner;
          store.data = store.validateAndMigrate(cloudData);
          store.saveToStorage(store.data);
          store.notify('cloud_synced');
          showToast('☁️ Cloud data synced!', 'success');
        } else {
          // Upload initial local data to newly created cloud account
          this.syncToCloud(store.getState());
        }
        updateCloudStatusDot('synced');
      } catch (e) {
        console.error('Fetch cloud data error:', e);
        updateCloudStatusDot('offline');
      }
    }

    listenToCloudChanges() {
      if (!this.db || !this.currentUser) return;
      this.db.collection('users').doc(this.currentUser.uid).onSnapshot(doc => {
        if (doc.exists && doc.data() && doc.data().planner) {
          const incoming = doc.data().planner;
          // Only update if different
          const currentStr = JSON.stringify(store.data);
          const incomingStr = JSON.stringify(incoming);
          if (currentStr !== incomingStr) {
            store.data = store.validateAndMigrate(incoming);
            store.saveToStorage(store.data);
            store.notify('cloud_realtime_update');
          }
        }
      });
    }
  }

  const cloud = new FirebaseSyncManager();

  // --- DATA STORE CLASS ---
  class AcademicStore {
    constructor() {
      this.listeners = new Set();
      this.data = this.loadFromStorage();
    }

    getStorageKey() {
      const key = accountManager.getActiveStorageKey();
      return key || 'academia_pro_data_v1';
    }

    loadFromStorage() {
      try {
        if (typeof localStorage !== 'undefined') {
          const raw = localStorage.getItem(this.getStorageKey());
          if (raw) {
            const parsed = JSON.parse(raw);
            return this.validateAndMigrate(parsed);
          }
        }
      } catch (e) {
        console.warn('Failed to parse localStorage data, loading default seed dataset.', e);
      }
      this.saveToStorage(DEFAULT_DATA);
      return JSON.parse(JSON.stringify(DEFAULT_DATA));
    }

    saveToStorage(data) {
      try {
        if (typeof localStorage !== 'undefined') {
          localStorage.setItem(this.getStorageKey(), JSON.stringify(data));
        }
      } catch (e) {
        console.error('Error saving data to localStorage:', e);
      }
    }

    reloadForAccount() {
      this.data = this.loadFromStorage();
      this.notify('account_switched');
    }

    validateAndMigrate(data) {
      if (!data.settings) data.settings = { ...DEFAULT_DATA.settings };
      if (!Array.isArray(data.semesters)) data.semesters = [...DEFAULT_DATA.semesters];
      if (!Array.isArray(data.classes)) data.classes = [...DEFAULT_DATA.classes];
      if (!Array.isArray(data.schedule)) data.schedule = [...DEFAULT_DATA.schedule];
      if (!Array.isArray(data.assignments)) data.assignments = [...DEFAULT_DATA.assignments];
      if (!Array.isArray(data.exams)) data.exams = [...DEFAULT_DATA.exams];
      return data;
    }

    subscribe(listener) {
      this.listeners.add(listener);
      return () => this.listeners.delete(listener);
    }

    notify(changeType, payload) {
      this.saveToStorage(this.data);
      if (changeType !== 'cloud_realtime_update') {
        cloud.syncToCloud(this.data);
      }
      this.listeners.forEach(fn => fn(changeType, payload, this.data));
    }

    getState() {
      return this.data;
    }

    getActiveSemester() {
      const active = this.data.semesters.find(s => s.id === this.data.settings.activeSemesterId);
      return active || this.data.semesters[0] || { id: 'default', name: 'Current Term' };
    }

    getClasses() {
      const semId = this.getActiveSemester().id;
      return this.data.classes.filter(c => c.semesterId === semId);
    }

    getClassById(classId) {
      return this.data.classes.find(c => c.id === classId);
    }

    getAssignments() {
      const semId = this.getActiveSemester().id;
      return this.data.assignments.filter(a => a.semesterId === semId);
    }

    getExams() {
      const semId = this.getActiveSemester().id;
      return this.data.exams.filter(e => e.semesterId === semId);
    }

    getSchedule() {
      const classes = this.getClasses();
      const classIds = new Set(classes.map(c => c.id));
      return this.data.schedule.filter(s => classIds.has(s.classId));
    }

    addAssignment(assignment) {
      const newAsg = {
        id: 'asg-' + Date.now(),
        semesterId: this.getActiveSemester().id,
        title: assignment.title || 'Untitled Assignment',
        description: assignment.description || '',
        classId: assignment.classId || '',
        type: assignment.type || 'homework',
        dueDate: assignment.dueDate || getRelativeDate(1),
        priority: assignment.priority || 'medium',
        status: assignment.status || 'not-started',
        completionPercentage: Number(assignment.completionPercentage) || 0,
        gradeCategoryId: assignment.gradeCategoryId || null,
        scoreEarned: assignment.scoreEarned !== undefined && assignment.scoreEarned !== '' && assignment.scoreEarned !== null ? Number(assignment.scoreEarned) : null,
        maxScore: Number(assignment.maxScore) || 100,
        subtasks: Array.isArray(assignment.subtasks) ? assignment.subtasks : [],
        notes: assignment.notes || ''
      };
      this.data.assignments.unshift(newAsg);
      this.notify('assignment_added', newAsg);
      return newAsg;
    }

    updateAssignment(id, updates) {
      const idx = this.data.assignments.findIndex(a => a.id === id);
      if (idx !== -1) {
        this.data.assignments[idx] = { ...this.data.assignments[idx], ...updates };
        this.notify('assignment_updated', this.data.assignments[idx]);
        return this.data.assignments[idx];
      }
      return null;
    }

    toggleAssignmentComplete(id) {
      const asg = this.data.assignments.find(a => a.id === id);
      if (asg) {
        const isComplete = asg.status === 'completed';
        asg.status = isComplete ? 'not-started' : 'completed';
        asg.completionPercentage = isComplete ? 0 : 100;
        if (asg.subtasks && asg.subtasks.length > 0) {
          asg.subtasks.forEach(st => st.isCompleted = !isComplete);
        }
        this.notify('assignment_toggled', asg);
      }
    }

    deleteAssignment(id) {
      const idx = this.data.assignments.findIndex(a => a.id === id);

        scheduleType: slot.scheduleType || 'all'
      };
      this.data.schedule.push(newSlot);
      this.notify('schedule_updated', newSlot);
      return newSlot;
    }

    deleteScheduleSlot(id) {
      this.data.schedule = this.data.schedule.filter(s => s.id !== id);
      this.notify('schedule_updated');
    }

    updateSettings(updates) {
      this.data.settings = { ...this.data.settings, ...updates };
      this.notify('settings_updated', this.data.settings);
    }

    resetToSampleData() {
      this.data = JSON.parse(JSON.stringify(DEFAULT_DATA));
      this.saveToStorage(this.data);
      this.notify('data_reset', this.data);
    }

    calculateClassGrade(classId) {
      const cls = this.getClassById(classId);
      if (!cls) return { score: null, letter: 'N/A', categories: [] };

      const classAsgs = this.getAssignments().filter(a => a.classId === classId && a.scoreEarned !== null);
      const classExams = this.getExams().filter(e => e.classId === classId && e.scoreEarned !== null);

      const categories = (cls.gradeCategories || []).map(cat => {
        const asgItems = classAsgs.filter(a => a.gradeCategoryId === cat.id);
        const examItems = classExams.filter(e => e.gradeCategoryId === cat.id);
        const allItems = [...asgItems, ...examItems];
        let earned = 0;
        let possible = 0;

        allItems.forEach(item => {
          earned += Number(item.scoreEarned);
          possible += Number(item.maxScore || 100);
        });

        const percentage = possible > 0 ? (earned / possible) * 100 : null;
        return {
          id: cat.id,
          name: cat.name,
          weight: cat.weight,
          earned,
          possible,
          percentage,
          itemCount: allItems.length
        };
      });

      let totalWeightUsed = 0;
      let weightedSum = 0;

      categories.forEach(cat => {
        if (cat.percentage !== null) {
          totalWeightUsed += cat.weight;
          weightedSum += (cat.percentage * (cat.weight / 100));
        }
      });

      const finalScore = totalWeightUsed > 0 ? (weightedSum / (totalWeightUsed / 100)) : null;
      const letter = this.percentageToLetter(finalScore);
      const gpaPoints = this.letterToGpaPoints(letter);

      return {
        score: finalScore !== null ? Math.round(finalScore * 10) / 10 : null,
        letter,
        gpaPoints,
        categories,
        totalWeightUsed
      };
    }

    calculateOverallGPA() {
      const classes = this.getClasses();
      if (classes.length === 0) return { gpa: 0.0, totalCredits: 0, gradedCount: 0 };

      let totalPoints = 0;
      let totalCredits = 0;
      let gradedCount = 0;

      classes.forEach(c => {
        const grade = this.calculateClassGrade(c.id);
        if (grade.score !== null) {
          const credits = c.credits || 3;
          totalPoints += (grade.gpaPoints * credits);
          totalCredits += credits;
          gradedCount++;
        }
      });

      const gpa = totalCredits > 0 ? (totalPoints / totalCredits) : 4.0;
      return {
        gpa: Math.round(gpa * 100) / 100,
        totalCredits,
        gradedCount
      };
    }

    simulateWhatIfGrade(classId, targetOverallScore, upcomingCategoryWeight) {
      const current = this.calculateClassGrade(classId);
      if (!current || current.score === null) {
        return { requiredScore: targetOverallScore, isFeasible: true };
      }

      const currentWeight = current.totalWeightUsed;
      const remainingWeight = 100 - currentWeight;
      const weightToUse = upcomingCategoryWeight || remainingWeight || 20;

      const totalNewWeight = currentWeight + weightToUse;
      const requiredScore = (targetOverallScore * (totalNewWeight / 100) - (current.score * (currentWeight / 100))) / (weightToUse / 100);

      return {
        currentScore: current.score,
        targetScore: targetOverallScore,
        weightUsed: weightToUse,
        requiredScore: Math.round(requiredScore * 10) / 10,
        isFeasible: requiredScore <= 100 && requiredScore >= 0
      };
    }

    percentageToLetter(pct) {
      if (pct === null || isNaN(pct)) return 'N/A';
      if (pct >= 93) return 'A';
      if (pct >= 90) return 'A-';
      if (pct >= 87) return 'B+';
      if (pct >= 83) return 'B';
      if (pct >= 80) return 'B-';
      if (pct >= 77) return 'C+';
      if (pct >= 73) return 'C';
      if (pct >= 70) return 'C-';
      if (pct >= 67) return 'D+';
      if (pct >= 60) return 'D';
      return 'F';
    }

    letterToGpaPoints(letter) {
      switch (letter) {
        case 'A': return 4.0;
        case 'A-': return 3.7;
        case 'B+': return 3.3;
        case 'B': return 3.0;
        case 'B-': return 2.7;
        case 'C+': return 2.3;
        case 'C': return 2.0;
        case 'C-': return 1.7;
        case 'D+': return 1.3;
        case 'D': return 1.0;
        case 'F': return 0.0;
        default: return 4.0;
      }
    }

    generateICalString() {
      const lines = [
        'BEGIN:VCALENDAR',
        'VERSION:2.0',
        'PRODID:-//Academia Pro//School Helper & Planner//EN',
        'CALSCALE:GREGORIAN',
        'METHOD:PUBLISH',
        'X-WR-CALNAME:Academia Pro Academic Schedule'
      ];

      const asgs = this.getAssignments();
      const exams = this.getExams();

      asgs.forEach(a => {
        const cls = this.getClassById(a.classId);
        const dt = new Date(a.dueDate);
        if (isNaN(dt.getTime())) return;
        const formattedDt = dt.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

        lines.push('BEGIN:VEVENT');
        lines.push(`UID:asg-${a.id}@academiapro.app`);
        lines.push(`DTSTAMP:${formattedDt}`);
        lines.push(`DTSTART:${formattedDt}`);
        lines.push(`DTEND:${formattedDt}`);
        lines.push(`SUMMARY:[${cls ? cls.name : 'School'}] ${a.title}`);
        lines.push(`DESCRIPTION:${(a.description || '').replace(/\n/g, '\\n')}`);
        lines.push('STATUS:CONFIRMED');
        lines.push('END:VEVENT');
      });

      exams.forEach(e => {
        const cls = this.getClassById(e.classId);
        const startDt = new Date(`${e.date}T${e.startTime}:00`);
        if (isNaN(startDt.getTime())) return;
        const endDt = new Date(startDt.getTime() + (e.duration || 60) * 60000);

        const fmtStart = startDt.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';
        const fmtEnd = endDt.toISOString().replace(/[-:]/g, '').split('.')[0] + 'Z';

        lines.push('BEGIN:VEVENT');
        lines.push(`UID:exam-${e.id}@academiapro.app`);
        lines.push(`DTSTAMP:${fmtStart}`);
        lines.push(`DTSTART:${fmtStart}`);
        lines.push(`DTEND:${fmtEnd}`);
        lines.push(`SUMMARY:📝 EXAM: [${cls ? cls.name : 'School'}] ${e.title}`);
        lines.push(`LOCATION:${e.room || ''}`);
        lines.push(`DESCRIPTION:${(e.description || '').replace(/\n/g, '\\n')}`);
        lines.push('STATUS:CONFIRMED');
        lines.push('END:VEVENT');
      });

      lines.push('END:VCALENDAR');
      return lines.join('\r\n');
    }
  }

  function applyTheme(theme) {
    document.documentElement.setAttribute('data-theme', theme);
    const icon = elements.themeToggleBtn ? elements.themeToggleBtn.querySelector('.theme-icon') : null;
    if (icon) {
      icon.innerHTML = theme === 'dark' 
        ? `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>`
        : `<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>`;

  function toggleTheme() {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    const next = current === 'dark' ? 'light' : 'dark';
    store.updateSettings({ theme: next });
    applyTheme(next);
    showToast(`Theme switched to ${next} mode`, 'info');
  }

  function bindGlobalEvents() {
    document.querySelectorAll('[data-nav-target]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.preventDefault();
        const target = btn.getAttribute('data-nav-target');
        navigateTo(target);
        if (elements.sidebar && elements.sidebar.classList.contains('mobile-open')) {
          elements.sidebar.classList.remove('mobile-open');
        }
      });
    });

    if (elements.mobileMenuToggle) {
      elements.mobileMenuToggle.addEventListener('click', () => {
        elements.sidebar.classList.toggle('mobile-open');
      });
    }

    if (elements.themeToggleBtn) {
      elements.themeToggleBtn.addEventListener('click', toggleTheme);
    }

    if (elements.quickAddBtn) {
      elements.quickAddBtn.addEventListener('click', () => openQuickAddModal());
    }

      elements.headerAuthBtn.addEventListener('click', () => openAccountModal());
    }
    if (elements.sidebarUserCard) {
      elements.sidebarUserCard.addEventListener('click', () => openAccountModal());

    if (elements.sidebarAuthBtn) {

  function setupKeyboardShortcuts() {
    window.addEventListener('keydown', (e) => {
      if (e.key === '/' && document.activeElement !== elements.globalSearchInput && !state.modalContext) {
        e.preventDefault();
        if (elements.globalSearchInput) elements.globalSearchInput.focus();
      }
      if ((e.key === 'q' || e.key === 'Q') && document.activeElement.tagName !== 'INPUT' && document.activeElement.tagName !== 'TEXTAREA' && !state.modalContext) {
        e.preventDefault();
        openQuickAddModal();
      }
      if (e.key === 'Escape' && state.modalContext) {

    state.currentView = viewId;

    document.querySelectorAll('[data-nav-target]').forEach(el => {
      if (el.getAttribute('data-nav-target') === viewId) {
        el.classList.add('active');
      } else {
        el.classList.remove('active');
      }
    });

    elements.viewSections.forEach(sec => {
      if (sec.id === `view-${viewId}`) {
        sec.classList.add('active');
      } else {
        sec.classList.remove('active');
      }
    });

    refreshCurrentView();
    updateBadges();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function refreshCurrentView() {
    switch (state.currentView) {
      case 'dashboard': renderDashboardView(); break;
      case 'assignments': renderAssignmentsView(); break;
      case 'exams': renderExamsView(); break;
      case 'calendar': renderCalendarView(); break;
      case 'schedule': renderScheduleView(); break;
      case 'grades': renderGradesView(); break;
      case 'classes': renderClassesView(); break;
      case 'analytics': renderAnalyticsView(); break;
      case 'settings': renderSettingsView(); break;
    }
  }

  function updateBadges() {
    const asgs = store.getAssignments();
    const exams = store.getExams();
    const now = new Date();

    const overdueCount = asgs.filter(a => a.status !== 'completed' && new Date(a.dueDate) < now).length;
    const pendingCount = asgs.filter(a => a.status !== 'completed').length;
    const upcomingExams = exams.filter(e => e.status === 'upcoming').length;

    const badgeAsg = document.getElementById('nav-badge-assignments');
    if (badgeAsg) {
      badgeAsg.textContent = pendingCount;
      badgeAsg.className = overdueCount > 0 ? 'nav-badge danger' : 'nav-badge';
    }

    const badgeExams = document.getElementById('nav-badge-exams');
    if (badgeExams) {
      badgeExams.textContent = upcomingExams;
    }
  }

  function populateSemesterSelector() {
    if (!elements.semesterSelect) return;
    const data = store.getState();
    elements.semesterSelect.innerHTML = data.semesters.map(s => `
      <option value="${s.id}" ${s.id === data.settings.activeSemesterId ? 'selected' : ''}>
        ${s.name} ${s.isActive ? '(Current)' : ''}
      </option>
    `).join('');
  }

      <div class="dashboard-grid">

                  <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>
                  Action Required: ${overdueTasks.length} Overdue Assignment${overdueTasks.length > 1 ? 's' : ''}
                </span>
              </div>

            <div class="panel-header">
              <span class="panel-title">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"></circle><polyline points="12 6 12 12 16 14"></polyline></svg>
                Upcoming Deadlines (Next 7 Days)

              <a href="#" class="panel-action-link" data-nav-target="assignments">View All Assignments →</a>

            <div class="tasks-list-container">

                    <div style="flex:1;">
                      <div style="font-weight:600; font-size:0.875rem; color:var(--text-primary);">${cls ? cls.name : 'Class'}</div>
                      <div style="font-size:0.75rem; color:var(--text-secondary);">${slot.startTime} - ${slot.endTime} • ${slot.room ? `Room ${slot.room}` : (cls ? cls.room : '')}</div>

          <div class="card-panel">

                Next Exams
              </span>
              <a href="#" class="panel-action-link" data-nav-target="exams">All Exams →</a>
            </div>

            <div class="upcoming-exams-list">
              ${upcomingExams.slice(0, 3).map(e => {
                const cls = store.getClassById(e.classId);
                const daysLeft = getDaysDiff(new Date(), new Date(e.date));
                return `
                  <div style="padding:0.75rem 0; border-bottom:1px solid var(--border-subtle);">
                    <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:0.25rem;">
                      <span style="font-weight:600; font-size:0.875rem; color:var(--text-primary);">${e.title}</span>
                      <span class="countdown-badge" style="font-size:0.6875rem;">
                        ${daysLeft === 0 ? 'Today!' : daysLeft === 1 ? 'Tomorrow' : `In ${daysLeft} days`}
                      </span>
                    </div>
                    <div style="font-size:0.75rem; color:var(--text-secondary);">
                      ${cls ? cls.name : ''} • ${formatDate(e.date)} at ${e.startTime}
                    </div>
                  </div>
                `;
              }).join('')}
              ${upcomingExams.length === 0 ? `<div style="color:var(--text-muted); font-size:0.875rem; text-align:center; padding:1rem;">No upcoming tests</div>` : ''}
